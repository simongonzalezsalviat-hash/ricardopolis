function CreateRecipeScreen({ go, authUser, profile, categories, showToast, onCreated, initialCategoryId }) {
  const cats = categories || CATEGORIES;
  const COLORS = ['#ff9500','#ff2d55','#5e5ce6','#34c759','#bf5af2','#0a84ff','#ffb340','#bf8a5b'];
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({
    title:'', description:'', category_id: initialCategoryId || cats[0]?.id || '',
    minutes:30, servings:4, difficulty:'Fácil',
    cover_color: COLORS[0], visibility:'public', cover_url: null,
  });
  const [ingredients, setIngredients] = useState([{_id:1,name:'',qty:'',unit:''}]);
  const [steps, setSteps] = useState([{_id:1,text:'',timer:''}]);
  const nextId = React.useRef(2);
  const newId = () => nextId.current++;
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const handleCoverUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const localUrl = URL.createObjectURL(file);
    set('cover_url', localUrl);
    try {
      const ext = file.name.split('.').pop();
      const path = `${authUser.id}/${Date.now()}.${ext}`;
      const { data, error } = await sb.storage.from('recipe-covers').upload(path, file, {
        contentType: file.type, upsert: true
      });
      if (!error) {
        const { data: { publicUrl } } = sb.storage.from('recipe-covers').getPublicUrl(path);
        URL.revokeObjectURL(localUrl);
        set('cover_url', publicUrl);
      }
    } catch(e) {}
  };

  const addIng  = () => setIngredients(a=>[...a,{_id:newId(),name:'',qty:'',unit:''}]);
  const updIng  = (i,k,v) => setIngredients(a=>a.map((x,j)=>j===i?{...x,[k]:v}:x));
  const remIng  = (i) => setIngredients(a=>a.filter((_,j)=>j!==i));
  const addStep = () => setSteps(a=>[...a,{_id:newId(),text:'',timer:''}]);
  const updStep = (i,k,v) => setSteps(a=>a.map((x,j)=>j===i?{...x,[k]:v}:x));
  const remStep = (i) => setSteps(a=>a.filter((_,j)=>j!==i));

  const handleSave = async () => {
    if (!form.title.trim()) { showToast('El título es obligatorio.'); return; }
    setSaving(true);
    try {
      const { data: recipe, error } = await sb.from('recipes').insert({
        title: form.title.trim(),
        description: form.description.trim() || null,
        category_id: form.category_id || null,
        minutes: parseInt(form.minutes)||30,
        servings: parseInt(form.servings)||4,
        difficulty: form.difficulty,
        cover_color: form.cover_color,
        cover_url: form.cover_url || null,
        visibility: form.visibility,
        author_id: authUser.id,
      }).select().single();
      if (error) throw error;

      // Ingredientes
      const ings = ingredients.filter(i=>i.name.trim());
      if (ings.length) {
        await sb.from('recipe_ingredients').insert(
          ings.map((i,pos)=>({ recipe_id:recipe.id, name:i.name.trim(), qty:parseFloat(i.qty)||1, unit:i.unit.trim()||'u', position:pos }))
        );
      }
      // Pasos
      const stps = steps.filter(s=>s.text.trim());
      if (stps.length) {
        await sb.from('recipe_steps').insert(
          stps.map((s,pos)=>({ recipe_id:recipe.id, text:s.text.trim(), timer_seconds:s.timer?parseInt(s.timer)*60:null, position:pos }))
        );
      }
      setSaving(false);
      showToast('¡Receta creada! 🎉');
      onCreated(recipe.id);
    } catch(err) {
      console.error(err);
      showToast('Error al guardar: ' + (err.message||'intentá de nuevo'));
      setSaving(false);
    }
  };

  return (
    <div style={{maxWidth:720}}>
      <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:28}}>
        <button className="icon-btn" onClick={()=>go(null)}><IconChevL size={18}/></button>
        <h1 className="h-large" style={{fontSize:30,margin:0}}>Nueva receta</h1>
        <button className="btn btn-primary" style={{marginLeft:'auto'}} onClick={handleSave} disabled={saving}>
          {saving ? <div className="spinner" style={{width:14,height:14,color:'#fff',borderWidth:2}}/> : 'Publicar'}
        </button>
      </div>

      {/* Portada */}
      <div className="field">
        <label>Color de portada</label>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {COLORS.map(c=>(
            <button key={c} onClick={()=>set('cover_color',c)} style={{width:32,height:32,borderRadius:'50%',background:c,
              outline:form.cover_color===c?'2.5px solid var(--text)':'none',outlineOffset:2}}/>
          ))}
          <div style={{width:'100%',height:80,borderRadius:12,marginTop:8,
            background:`repeating-linear-gradient(135deg,${form.cover_color}33 0 12px,${form.cover_color}66 12px 24px)`}}/>
        </div>
      </div>

      {/* Foto de portada */}
      <div className="field">
        <label>Foto de portada <span style={{color:'var(--text-3)',fontSize:12,fontWeight:400}}>(opcional)</span></label>
        <input type="file" accept="image/*" id="cover-upload" style={{display:'none'}}
               onChange={handleCoverUpload}/>
        {form.cover_url ? (
          <div style={{position:'relative',borderRadius:12,overflow:'hidden',height:120}}>
            <img src={form.cover_url} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
            <button type="button" onClick={()=>set('cover_url',null)}
              style={{position:'absolute',top:8,right:8,background:'rgba(0,0,0,.5)',border:'none',
                      borderRadius:6,color:'#fff',padding:'4px 8px',cursor:'pointer',fontSize:12}}>
              Quitar
            </button>
          </div>
        ) : (
          <label htmlFor="cover-upload" style={{display:'flex',alignItems:'center',gap:10,
            padding:'12px 16px',borderRadius:10,border:'1.5px dashed var(--border)',cursor:'pointer',
            color:'var(--text-2)',fontSize:14,transition:'border-color .15s ease'}}
            onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
            onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Subir foto desde tu dispositivo
          </label>
        )}
      </div>

      <div className="field">
        <label>Título *</label>
        <input className="input" placeholder="Ej. Pasta al pesto genovés" value={form.title} onChange={e=>set('title',e.target.value)}/>
      </div>
      <div className="field">
        <label>Descripción</label>
        <textarea className="textarea" placeholder="Una línea que describa la receta..." value={form.description} onChange={e=>set('description',e.target.value)}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
        <div className="field">
          <label>Tiempo (min)</label>
          <input className="input" type="number" min="1" value={form.minutes} onChange={e=>set('minutes',e.target.value)}/>
        </div>
        <div className="field">
          <label>Porciones</label>
          <input className="input" type="number" min="1" value={form.servings} onChange={e=>set('servings',e.target.value)}/>
        </div>
        <div className="field">
          <label>Dificultad</label>
          <select className="input" value={form.difficulty} onChange={e=>set('difficulty',e.target.value)}>
            {['Fácil','Media','Difícil'].map(d=><option key={d}>{d}</option>)}
          </select>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div className="field">
          <label>Categoría</label>
          <select className="input" value={form.category_id} onChange={e=>set('category_id',e.target.value)}>
            <option value="">Sin categoría</option>
            {cats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Visibilidad</label>
          <select className="input" value={form.visibility} onChange={e=>set('visibility',e.target.value)}>
            <option value="public">Público</option>
            <option value="friends">Solo amigos</option>
            <option value="private">Privado</option>
          </select>
        </div>
      </div>

      {/* Ingredientes */}
      <div style={{marginTop:28}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <h3 style={{margin:0,fontSize:18,fontWeight:600}}>Ingredientes</h3>
          <button className="btn btn-ghost btn-sm" style={{height:30,padding:'0 12px',fontSize:13}} onClick={addIng}><IconPlus size={13}/> Agregar</button>
        </div>
        {ingredients.map((ing,i)=>(
          <div key={ing._id} style={{display:'grid',gridTemplateColumns:'1fr 80px 80px 32px',gap:8,marginBottom:8,alignItems:'start'}}>
            <input className="input" placeholder="Ingrediente" value={ing.name} onChange={e=>updIng(i,'name',e.target.value)}/>
            <input className="input" placeholder="Cant." type="number" min="0" step="0.1" value={ing.qty} onChange={e=>updIng(i,'qty',e.target.value)}/>
            <input className="input" placeholder="Unidad" value={ing.unit} onChange={e=>updIng(i,'unit',e.target.value)}/>
            <button className="icon-btn" style={{color:'var(--text-3)'}} onClick={()=>remIng(i)} disabled={ingredients.length===1}><IconMinus size={14}/></button>
          </div>
        ))}
      </div>

      {/* Pasos */}
      <div style={{marginTop:28}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <h3 style={{margin:0,fontSize:18,fontWeight:600}}>Pasos</h3>
          <button className="btn btn-ghost btn-sm" style={{height:30,padding:'0 12px',fontSize:13}} onClick={addStep}><IconPlus size={13}/> Agregar</button>
        </div>
        {steps.map((step,i)=>(
          <div key={step._id} style={{display:'grid',gridTemplateColumns:'1fr 100px 32px',gap:8,marginBottom:10,alignItems:'start'}}>
            <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
              <div style={{width:26,height:26,borderRadius:'50%',background:'var(--surface)',border:'1px solid var(--border)',display:'grid',placeItems:'center',fontSize:12,fontWeight:600,color:'var(--text-2)',flexShrink:0,marginTop:10}}>{i+1}</div>
              <textarea className="textarea" placeholder={`Describí el paso ${i+1}...`} style={{minHeight:60}} value={step.text} onChange={e=>updStep(i,'text',e.target.value)}/>
            </div>
            <div style={{paddingTop:10}}>
              <input className="input" type="number" placeholder="Timer (min)" min="0" value={step.timer} onChange={e=>updStep(i,'timer',e.target.value)}/>
            </div>
            <button className="icon-btn" style={{color:'var(--text-3)',marginTop:10}} onClick={()=>remStep(i)} disabled={steps.length===1}><IconMinus size={14}/></button>
          </div>
        ))}
      </div>

      <div style={{height:60}}/>
    </div>
  );
}

// ─── LOGIN SCREEN ────────────────────────────────────────────────────────────
function LoginScreen({ onLogin, dark, onToggleDark }) {
  const [loading, setLoading] = useState(null);
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [showPass, setShowPass] = useState(false);
  const [mode, setMode] = useState('login'); // 'login' | 'register' | 'email-sent' | 'forgot' | 'reset-sent'
  const [err, setErr] = useState('');

  const switchMode = (m) => { setMode(m); setErr(''); setPass(''); };

  const providerErr = (p) =>
    p === 'google'   ? 'Google no está activado aún. Usá correo y contraseña por ahora.' :
    p === 'apple'    ? 'Apple no está activado aún. Usá correo y contraseña por ahora.' :
                       'Facebook no está activado aún. Usá correo y contraseña por ahora.';

  const handleSocial = async (provider) => {
    setErr('');
    setLoading(provider);
    try {
      const { data, error } = await sb.auth.signInWithOAuth({
        provider,
        options: { redirectTo: window.location.href, skipBrowserRedirect: true }
      });
      if (error) { setErr(providerErr(provider)); setLoading(null); return; }

      // Verificar que el proveedor esté habilitado antes de redirigir
      try {
        const res = await fetch(data.url, { redirect: 'manual' });
        // opaqueredirect = 302 a OAuth = proveedor configurado ✓
        // status >= 400 = proveedor no habilitado
        if (res.type !== 'opaqueredirect' && res.status >= 400) {
          setErr(providerErr(provider)); setLoading(null); return;
        }
      } catch(_) { /* CORS bloqueó el pre-check — redirigimos igual */ }

      window.location.href = data.url;
    } catch(e) {
      setErr('Error al conectar. Intentá de nuevo.');
      setLoading(null);
    }
  };

  const handleForgot = async (e) => {
    e.preventDefault();
    if (!email.trim()) { setErr('Ingresá tu correo para recuperar la contraseña.'); return; }
    setErr(''); setLoading('forgot');
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), {
      redirectTo: window.location.href
    });
    setLoading(null);
    if (error) { setErr('No se pudo enviar el correo. Verificá la dirección.'); return; }
    setMode('reset-sent');
  };

  const handleEmail = async (e) => {
    e.preventDefault();
    if (!email.trim()) { setErr('Ingresá tu correo.'); return; }
    if (pass.length < 6) { setErr('La contraseña debe tener al menos 6 caracteres.'); return; }
    setErr(''); setLoading('email');
    try {
      let authRes;
      if (mode === 'login') {
        authRes = await sb.auth.signInWithPassword({ email: email.trim(), password: pass });
      } else {
        authRes = await sb.auth.signUp({ email: email.trim(), password: pass });
      }
      if (authRes.error) {
        const msg = authRes.error.message;
        setErr(
          msg.includes('not confirmed') ? 'Confirmá tu correo antes de ingresar. Revisá tu bandeja de entrada.' :
          msg.includes('Invalid login')  ? 'Correo o contraseña incorrectos.' :
          msg.includes('already registered') ? 'Ya existe una cuenta con ese correo. Iniciá sesión.' :
          msg.includes('weak')           ? 'Contraseña muy débil. Usá letras, números y símbolos.' :
          msg
        );
        setLoading(null); return;
      }

      const user = authRes.data.user;
      const session = authRes.data.session;

      if (mode === 'register' && user && !session) {
        setLoading(null);
        setMode('email-sent');
        return;
      }
      if (!user || !session) {
        setErr('Revisá tu correo para confirmar la cuenta antes de ingresar.');
        setLoading(null); return;
      }

      let { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      if (!profile) {
        const raw = email.split('@')[0].replace(/[^a-z0-9]/gi, ' ');
        const display_name = raw.replace(/\b\w/g, c=>c.toUpperCase()).trim() || 'Usuario';
        const username = email.split('@')[0].replace(/[^a-z0-9_]/gi, '_').toLowerCase() + '_' + Math.floor(Math.random()*9000+1000);
        const { data: np } = await sb.from('profiles').insert({ id: user.id, username, display_name }).select().maybeSingle();
        profile = np;
      }
      setLoading(null);
      onLogin(profile || { display_name: email.split('@')[0] });
    } catch(err) {
      setErr('Error al conectar. Intentá de nuevo.');
      setLoading(null);
    }
  };

  return (
    <div className="login-wrap">
      <div style={{position:'fixed',top:16,right:16,zIndex:10}}>
        <button className="icon-btn" onClick={onToggleDark} title={dark?'Modo claro':'Modo oscuro'}>
          {dark ? <IconSun size={16}/> : <IconMoon size={16}/>}
        </button>
      </div>
      <div className="login-card">
        <div className="login-logo">
          <div className="brand-mark" style={{width:42,height:42,fontSize:20,borderRadius:12}}>M</div>
          <span className="brand-name" style={{fontSize:24}}>Menú</span>
        </div>
        {mode === 'email-sent' ? (
          <div style={{textAlign:'center',padding:'8px 0'}}>
            <div style={{fontSize:40,marginBottom:12}}>📬</div>
            <h2 style={{fontSize:20,fontWeight:700,margin:'0 0 8px'}}>Revisá tu correo</h2>
            <p style={{fontSize:14,color:'var(--text-2)',margin:'0 0 20px',lineHeight:1.5}}>
              Te enviamos un enlace de confirmación a <strong>{email}</strong>. Hacé clic en el enlace y volvé para iniciar sesión.
            </p>
            <button className="btn btn-secondary" style={{width:'100%',borderRadius:12,height:44}} onClick={()=>switchMode('login')}>
              Ya confirmé, ir al login
            </button>
          </div>
        ) : mode === 'reset-sent' ? (
          <div style={{textAlign:'center',padding:'8px 0'}}>
            <div style={{fontSize:40,marginBottom:12}}>🔑</div>
            <h2 style={{fontSize:20,fontWeight:700,margin:'0 0 8px'}}>Correo enviado</h2>
            <p style={{fontSize:14,color:'var(--text-2)',margin:'0 0 20px',lineHeight:1.5}}>
              Enviamos un enlace para restablecer tu contraseña a <strong>{email}</strong>. Revisá tu bandeja de entrada.
            </p>
            <button className="btn btn-secondary" style={{width:'100%',borderRadius:12,height:44}} onClick={()=>switchMode('login')}>
              Volver al login
            </button>
          </div>
        ) : mode === 'forgot' ? (
          <>
            <h1 className="login-title">Recuperar contraseña</h1>
            <p className="login-sub">Te enviamos un enlace para crear una nueva.</p>
            <form onSubmit={handleForgot} style={{marginTop:8}}>
              <div className="field">
                <label>Correo electrónico</label>
                <input className="input" type="email" placeholder="nombre@ejemplo.com"
                       value={email} onChange={e=>{setEmail(e.target.value);setErr('')}}
                       autoComplete="email" autoFocus/>
              </div>
              {err && <p style={{color:'var(--danger)',fontSize:12.5,margin:'-6px 0 10px',fontWeight:500}}>{err}</p>}
              <button type="submit" className="btn btn-primary btn-lg btn-login" disabled={!!loading}>
                {loading==='forgot'
                  ? <div className="spinner" style={{color:'#fff',width:16,height:16,borderWidth:2}}/>
                  : 'Enviar enlace'}
              </button>
            </form>
            <div className="login-footer">
              <span>¿Recordaste? <button onClick={()=>switchMode('login')}>Iniciá sesión</button></span>
            </div>
          </>
        ) : (
          <>
            <h1 className="login-title">{mode==='login'?'Bienvenido de vuelta':'Crear cuenta'}</h1>
            <p className="login-sub">Tu cocina, siempre organizada.</p>

            <button className="social-btn apple" onClick={()=>handleSocial('apple')} disabled={!!loading}>
              <span className="social-icon"><IconApple light={dark}/></span>
              <span className="social-label">Continuar con Apple</span>
              {loading==='apple' && <div className="social-loading"><div className="spinner"/></div>}
            </button>
            <button className="social-btn" onClick={()=>handleSocial('google')} disabled={!!loading}>
              <span className="social-icon"><IconGoogle/></span>
              <span className="social-label">Continuar con Google</span>
              {loading==='google' && <div className="social-loading"><div className="spinner" style={{borderTopColor:'var(--accent)'}}/></div>}
            </button>
            <button className="social-btn fb" onClick={()=>handleSocial('facebook')} disabled={!!loading}>
              <span className="social-icon"><IconFacebook/></span>
              <span className="social-label">Continuar con Facebook</span>
              {loading==='facebook' && <div className="social-loading"><div className="spinner" style={{color:'#fff'}}/></div>}
            </button>

            <div className="login-or">o con correo</div>

            <form onSubmit={handleEmail}>
              <div className="field">
                <label>Correo electrónico</label>
                <input className="input" type="email" placeholder="nombre@ejemplo.com"
                       value={email} onChange={e=>{setEmail(e.target.value);setErr('')}}
                       autoComplete="email"/>
              </div>
              <div className="field">
                <label style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span>Contraseña</span>
                  {mode==='login' && (
                    <button type="button" onClick={()=>switchMode('forgot')}
                      style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:'var(--accent)',padding:0,fontWeight:500}}>
                      ¿Olvidaste tu contraseña?
                    </button>
                  )}
                </label>
                <div style={{position:'relative'}}>
                  <input className="input" type={showPass?'text':'password'}
                         placeholder={mode==='login'?'Tu contraseña':'Mínimo 6 caracteres'}
                         value={pass} onChange={e=>{setPass(e.target.value);setErr('')}}
                         autoComplete={mode==='login'?'current-password':'new-password'}
                         style={{paddingRight:40}}/>
                  <button type="button" onClick={()=>setShowPass(s=>!s)}
                    style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'var(--text-3)',padding:4,display:'flex',alignItems:'center'}}>
                    {showPass
                      ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                      : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    }
                  </button>
                </div>
              </div>
              {err && <p style={{color:'var(--danger)',fontSize:12.5,margin:'-6px 0 10px',fontWeight:500}}>{err}</p>}
              <button type="submit" className="btn btn-primary btn-lg btn-login" disabled={!!loading}>
                {loading==='email'
                  ? <div className="spinner" style={{color:'#fff',width:16,height:16,borderWidth:2}}/>
                  : (mode==='login'?'Entrar':'Crear cuenta')}
              </button>
            </form>

            <div className="login-footer">
              {mode==='login'
                ? <span>¿No tenés cuenta? <button onClick={()=>switchMode('register')}>Registrate</button></span>
                : <span>¿Ya tenés cuenta? <button onClick={()=>switchMode('login')}>Iniciá sesión</button></span>}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ─── USER PROFILE SCREEN ─────────────────────────────────────────────────────
function UserProfileScreen({ userId, go, authUser }) {
  const [profile, setProfile] = useState(null);
  const [recipes, setRecipes] = useState([]);
  const [menus,   setMenus]   = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');

  useEffect(() => {
    if (!userId) return;
    setLoading(true); setErr('');
    (async () => {
      const { data: prof } = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
      if (!prof) { setErr('Usuario no encontrado.'); setLoading(false); return; }
      setProfile(prof);
      const [recsRes, menusRes] = await Promise.all([
        sb.from('recipes')
          .select('id,title,cover_url,cover_color,minutes,difficulty,category_id')
          .eq('author_id', userId).eq('visibility','public')
          .order('created_at', { ascending: false }),
        sb.from('menus')
          .select('id,title,cover,cover_url,visibility')
          .eq('user_id', userId).eq('visibility','public')
          .order('created_at', { ascending: false }),
      ]);
      setRecipes(recsRes.data || []);
      // for each public menu fetch recipe count
      const pubMenus = menusRes.data || [];
      if (pubMenus.length) {
        const { data: mrs } = await sb.from('menu_recipes').select('menu_id,recipe_id').in('menu_id', pubMenus.map(m=>m.id));
        const counts = {};
        (mrs||[]).forEach(mr => { counts[mr.menu_id] = (counts[mr.menu_id]||0)+1; });
        setMenus(pubMenus.map(m => ({...m, recipeCount: counts[m.id]||0})));
      } else {
        setMenus([]);
      }
      setLoading(false);
    })();
  }, [userId]);

  if (loading) return <div style={{padding:60,textAlign:'center'}}><div className="spinner" style={{margin:'0 auto'}}/></div>;
  if (err) return <div style={{padding:60,textAlign:'center',color:'var(--text-3)',fontSize:15}}>{err}</div>;
  if (!profile) return null;

  const initials = (profile.display_name||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const isOwn = authUser?.id === userId;

  return (
    <div style={{maxWidth:680,margin:'0 auto',padding:'0 0 60px'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:20,marginBottom:32,padding:24,background:'var(--surface)',borderRadius:18,border:'1px solid var(--border)'}}>
        <div className="avatar" style={{
          width:72,height:72,fontSize:26,flexShrink:0,
          background: profile.avatar_url ? 'transparent' : '#007aff',
          backgroundImage: profile.avatar_url ? `url(${profile.avatar_url})` : 'none',
          backgroundSize:'cover',backgroundPosition:'center'
        }}>{!profile.avatar_url && initials}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:20,fontWeight:700,letterSpacing:'-.02em'}}>{profile.display_name}</div>
          {profile.username && <div style={{fontSize:13.5,color:'var(--text-3)',margin:'2px 0 6px'}}>@{profile.username}</div>}
          {profile.bio && <div style={{fontSize:13.5,color:'var(--text-2)',lineHeight:1.45,marginBottom:8}}>{profile.bio}</div>}
          <div style={{display:'flex',gap:16,marginTop:4}}>
            <span style={{fontSize:13,color:'var(--text-2)'}}><strong style={{color:'var(--text)'}}>{recipes.length}</strong> recetas</span>
            <span style={{fontSize:13,color:'var(--text-2)'}}><strong style={{color:'var(--text)'}}>{menus.length}</strong> menús</span>
          </div>
        </div>
        {isOwn && (
          <button className="btn btn-secondary" style={{height:34,fontSize:13,flexShrink:0}} onClick={()=>go({screen:'perfil'})}>
            Editar perfil
          </button>
        )}
      </div>

      {/* Menus */}
      {menus.length > 0 && <>
        <div className="section-head" style={{marginTop:0}}>
          <div className="left"><h2 className="h-section">Menús públicos</h2></div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:10,marginBottom:28}}>
          {menus.map(m => (
            <div key={m.id} className="card clickable" style={{padding:0,overflow:'hidden',cursor:'pointer'}}
              onClick={()=>go({screen:'menu',id:m.id})}>
              <div style={{height:90,background:m.cover_url?`url(${m.cover_url}) center/cover`:(m.cover||'#007aff'),position:'relative'}}>
                {!m.cover_url && <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',padding:12}}>
                  <span style={{fontWeight:700,fontSize:14,color:'rgba(255,255,255,.9)',textAlign:'center',textShadow:'0 1px 4px rgba(0,0,0,.3)',lineHeight:1.3}}>{m.title}</span>
                </div>}
              </div>
              <div style={{padding:'10px 12px'}}>
                <div style={{fontWeight:600,fontSize:14,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.title}</div>
                <div style={{fontSize:12,color:'var(--text-3)',marginTop:2}}>{m.recipeCount} recetas</div>
              </div>
            </div>
          ))}
        </div>
      </>}

      {/* Recipes */}
      <div className="section-head" style={{marginTop:0}}>
        <div className="left"><h2 className="h-section">Recetas</h2></div>
      </div>
      {recipes.length === 0 ? (
        <div style={{textAlign:'center',padding:'40px 0',color:'var(--text-3)',fontSize:14}}>
          {isOwn ? 'Todavía no publicaste recetas.' : 'Este usuario no tiene recetas públicas.'}
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          {recipes.map(r => (
            <div key={r.id} className="recipe-row" onClick={()=>go({screen:'recipe',id:r.id})}>
              <div className="rr-thumb">
                {r.cover_url
                  ? <div style={{width:'100%',height:'100%',background:`url(${r.cover_url}) center/cover`}}/>
                  : <div style={{width:'100%',height:'100%',background:r.cover_color||'#007aff',borderRadius:10}}/>
                }
              </div>
              <div>
                <div className="rr-title">{r.title}</div>
                <div className="rr-meta">
                  <span><IconClock size={11}/> {r.minutes} min</span>
                  <span>· {r.difficulty}</span>
                </div>
              </div>
              <IconChevR size={16} stroke="var(--text-3)"/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── PROFILE SCREEN ──────────────────────────────────────────────────────────
function ProfileScreen({ authUser, profile, onProfileUpdate, showToast }) {
  const [displayName, setDisplayName] = useState(profile?.display_name || '');
  const [username,    setUsername]    = useState(profile?.username     || '');
  const [bio,         setBio]         = useState(profile?.bio          || '');
  const [avatarUrl,   setAvatarUrl]   = useState(profile?.avatar_url   || '');
  const [saving,  setSaving]  = useState(false);
  const [err,     setErr]     = useState('');
  const [success, setSuccess] = useState(false);

  const handleSave = async (e) => {
    e.preventDefault();
    if (!displayName.trim()) { setErr('Ingresá tu nombre.'); return; }
    if (!username.trim())    { setErr('Ingresá un nombre de usuario.'); return; }
    if (!/^[a-z0-9_]{3,30}$/.test(username.trim())) {
      setErr('El usuario debe tener 3-30 caracteres: letras minúsculas, números o _'); return;
    }
    setSaving(true); setErr(''); setSuccess(false);
    const updates = {
      display_name: displayName.trim(),
      username:     username.trim().toLowerCase(),
      bio:          bio.trim() || null,
      avatar_url:   avatarUrl.trim() || null,
    };
    const { error } = await sb.from('profiles').update(updates).eq('id', authUser.id);
    setSaving(false);
    if (error) {
      setErr(error.message.includes('unique') ? 'Ese nombre de usuario ya está en uso.' : error.message);
      return;
    }
    onProfileUpdate({ ...profile, ...updates });
    setSuccess(true);
    showToast('Perfil actualizado ✓');
  };

  const avatarInitials = displayName.trim()
    ? displayName.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()
    : '?';

  return (
    <div style={{maxWidth:520,margin:'0 auto',padding:'0 0 60px'}}>
      <h2 style={{margin:'0 0 24px',fontSize:22,fontWeight:700}}>Mi perfil</h2>

      {/* Avatar preview */}
      <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:28,padding:20,background:'var(--surface)',borderRadius:14,border:'1px solid var(--border)'}}>
        <div className="avatar" style={{width:64,height:64,fontSize:22,flexShrink:0,
          background: avatarUrl ? 'transparent' : '#007aff',
          backgroundImage: avatarUrl ? `url(${avatarUrl})` : 'none',
          backgroundSize:'cover',backgroundPosition:'center'}}>
          {!avatarUrl && avatarInitials}
        </div>
        <div>
          <div style={{fontWeight:600,fontSize:16}}>{displayName || 'Tu nombre'}</div>
          <div style={{color:'var(--text-3)',fontSize:13}}>@{username || 'usuario'}</div>
          <div style={{color:'var(--text-3)',fontSize:12,marginTop:2}}>{authUser?.email}</div>
        </div>
      </div>

      <form onSubmit={handleSave}>
        <div className="field">
          <label>Nombre completo</label>
          <input className="input" type="text" placeholder="Tu nombre"
                 value={displayName} onChange={e=>{setDisplayName(e.target.value);setErr('');setSuccess(false)}}
                 maxLength={60}/>
        </div>
        <div className="field">
          <label>Nombre de usuario</label>
          <div style={{position:'relative'}}>
            <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-3)',fontSize:14,pointerEvents:'none'}}>@</span>
            <input className="input" type="text" placeholder="tuusuario"
                   value={username} onChange={e=>{setUsername(e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,''));setErr('');setSuccess(false)}}
                   style={{paddingLeft:26}} maxLength={30}/>
          </div>
        </div>
        <div className="field">
          <label>Bio <span style={{color:'var(--text-3)',fontWeight:400,fontSize:12}}>(opcional)</span></label>
          <textarea className="textarea" placeholder="Contá algo sobre vos o tu cocina..."
                    value={bio} onChange={e=>{setBio(e.target.value);setErr('');setSuccess(false)}}
                    style={{minHeight:72}} maxLength={200}/>
        </div>
        <div className="field">
          <label>URL de foto de perfil <span style={{color:'var(--text-3)',fontWeight:400,fontSize:12}}>(opcional)</span></label>
          <input className="input" type="url" placeholder="https://..."
                 value={avatarUrl} onChange={e=>{setAvatarUrl(e.target.value);setErr('');setSuccess(false)}}/>
        </div>

        {err     && <p style={{color:'var(--danger)',fontSize:13,margin:'-4px 0 14px',fontWeight:500}}>{err}</p>}
        {success && <p style={{color:'#30d158',fontSize:13,margin:'-4px 0 14px',fontWeight:500}}>✓ Cambios guardados</p>}

        <button type="submit" className="btn btn-primary" style={{height:44,borderRadius:12,width:'100%',fontSize:15}} disabled={saving}>
          {saving ? <div className="spinner" style={{color:'#fff',width:16,height:16,borderWidth:2,margin:'0 auto'}}/> : 'Guardar cambios'}
        </button>
      </form>
    </div>
  );
}

// ─── MESSAGES SCREEN ─────────────────────────────────────────────────────────
function MessagesScreen({ authUser, profile, go, showToast }) {
  const [conversations, setConversations] = useState([]);
  const [search, setSearch] = useState('');
  const [searchResults, setSearchResults] = useState([]);
  const [activeChat, setActiveChat] = useState(null);
  const [messages, setMessages] = useState([]);
  const [newMsg, setNewMsg] = useState('');
  const [sending, setSending] = useState(false);
  const messagesEndRef = React.useRef(null);

  useEffect(() => {
    if (!authUser) return;
    (async () => {
      try {
        const { data } = await sb.from('direct_messages')
          .select('from_id,to_id,body,created_at')
          .or(`from_id.eq.${authUser.id},to_id.eq.${authUser.id}`)
          .order('created_at', {ascending:false})
          .limit(50);
        if (!data?.length) { setConversations([]); return; }
        const convMap = {};
        for (const msg of data) {
          const otherId = msg.from_id === authUser.id ? msg.to_id : msg.from_id;
          if (!convMap[otherId]) convMap[otherId] = { otherId, lastMsg: msg.body, lastTime: msg.created_at };
        }
        const otherIds = Object.keys(convMap);
        if (!otherIds.length) return;
        const { data: profiles } = await sb.from('profiles').select('id,display_name,username').in('id', otherIds);
        const profMap = Object.fromEntries((profiles||[]).map(p=>[p.id,p]));
        setConversations(Object.values(convMap).map(c=>({
          ...c, profile: profMap[c.otherId] || { display_name: 'Usuario', username: '' }
        })).sort((a,b)=>new Date(b.lastTime)-new Date(a.lastTime)));
      } catch(e) {}
    })();
  }, [authUser?.id]);

  useEffect(() => {
    if (!search.trim() || search.length < 2) { setSearchResults([]); return; }
    const timer = setTimeout(async () => {
      try {
        const { data } = await sb.from('profiles').select('id,display_name,username')
          .ilike('username', `%${search}%`).neq('id', authUser.id).limit(8);
        setSearchResults(data || []);
      } catch(e) {}
    }, 300);
    return () => clearTimeout(timer);
  }, [search]);

  useEffect(() => {
    if (!activeChat || !authUser) return;
    (async () => {
      try {
        const { data } = await sb.from('direct_messages')
          .select('*')
          .or(`and(from_id.eq.${authUser.id},to_id.eq.${activeChat.id}),and(from_id.eq.${activeChat.id},to_id.eq.${authUser.id})`)
          .order('created_at', {ascending:true})
          .limit(100);
        setMessages(data || []);
        setTimeout(()=>messagesEndRef.current?.scrollIntoView({behavior:'smooth'}),100);
      } catch(e) {}
    })();
    const channel = sb.channel(`dm-${[authUser.id, activeChat.id].sort().join('-')}`)
      .on('postgres_changes', {event:'INSERT',schema:'public',table:'direct_messages'}, (payload) => {
        const msg = payload.new;
        if (
          (msg.from_id === activeChat.id && msg.to_id === authUser.id) ||
          (msg.from_id === authUser.id   && msg.to_id === activeChat.id)
        ) {
          setMessages(m => [...m, msg]);
          setTimeout(()=>messagesEndRef.current?.scrollIntoView({behavior:'smooth'}),50);
        }
      })
      .subscribe();
    return () => { sb.removeChannel(channel); };
  }, [activeChat?.id]);

  const handleSend = async () => {
    if (!newMsg.trim() || !activeChat || sending) return;
    setSending(true);
    const body = newMsg.trim();
    setNewMsg('');
    try {
      const { data, error } = await sb.from('direct_messages').insert({
        from_id: authUser.id, to_id: activeChat.id, body
      }).select().single();
      if (!error && data) {
        setMessages(m => [...m, data]);
        setTimeout(()=>messagesEndRef.current?.scrollIntoView({behavior:'smooth'}),50);
      }
    } catch(e) { showToast('Error al enviar'); }
    setSending(false);
  };

  const initials = (name) => name?.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
  const timeAgo = (ts) => {
    const d = new Date(ts), now = new Date();
    const diff = (now-d)/1000;
    if (diff<60) return 'ahora';
    if (diff<3600) return `${Math.floor(diff/60)}m`;
    if (diff<86400) return `${Math.floor(diff/3600)}h`;
    return d.toLocaleDateString('es-AR',{day:'numeric',month:'short'});
  };

  if (activeChat) {
    return (
      <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 56px)',maxWidth:680}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0 16px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          <button className="icon-btn" onClick={()=>setActiveChat(null)}><IconChevL size={18}/></button>
          <div className="avatar" style={{background:'#5e5ce6',width:36,height:36,fontSize:13,flexShrink:0}}>{initials(activeChat.display_name)}</div>
          <div>
            <div style={{fontWeight:600,fontSize:15}}>{activeChat.display_name}</div>
            <div style={{color:'var(--text-3)',fontSize:12}}>@{activeChat.username}</div>
          </div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'16px 0',display:'flex',flexDirection:'column',gap:8}}>
          {messages.length === 0 && (
            <div style={{textAlign:'center',color:'var(--text-3)',fontSize:14,marginTop:40}}>
              Iniciá la conversación ✉️
            </div>
          )}
          {messages.map(msg => {
            const mine = msg.from_id === authUser.id;
            return (
              <div key={msg.id} style={{display:'flex',justifyContent:mine?'flex-end':'flex-start',padding:'0 4px'}}>
                <div style={{
                  maxWidth:'72%',padding:'10px 14px',borderRadius:mine?'18px 18px 4px 18px':'18px 18px 18px 4px',
                  background:mine?'var(--accent)':'var(--surface)',
                  color:mine?'#fff':'var(--text)',fontSize:14,lineHeight:1.45
                }}>
                  {msg.body}
                  <div style={{fontSize:10,marginTop:4,opacity:.65,textAlign:'right'}}>{timeAgo(msg.created_at)}</div>
                </div>
              </div>
            );
          })}
          <div ref={messagesEndRef}/>
        </div>
        <div style={{display:'flex',gap:8,padding:'12px 0',borderTop:'1px solid var(--border)',flexShrink:0}}>
          <input className="input" style={{flex:1}} placeholder="Escribí un mensaje..."
                 value={newMsg} onChange={e=>setNewMsg(e.target.value)}
                 onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&handleSend()}/>
          <button className="btn btn-primary" style={{height:42,padding:'0 16px',borderRadius:10,flexShrink:0}}
                  onClick={handleSend} disabled={!newMsg.trim()||sending}>
            {sending ? '...' : 'Enviar'}
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{maxWidth:580}}>
      <h2 style={{margin:'0 0 20px',fontSize:22,fontWeight:700}}>Mensajes</h2>
      <div className="field" style={{marginBottom:20}}>
        <input className="input" placeholder="Buscar usuario por @nombre..."
               value={search} onChange={e=>setSearch(e.target.value)}/>
        {searchResults.length > 0 && (
          <div style={{marginTop:8,border:'1px solid var(--border)',borderRadius:10,overflow:'hidden',background:'var(--surface)'}}>
            {searchResults.map(u=>(
              <button key={u.id} onClick={()=>{setActiveChat(u);setSearch('');setSearchResults([]);setMessages([]);}}
                style={{width:'100%',display:'flex',alignItems:'center',gap:12,padding:'10px 14px',
                        background:'none',border:'none',cursor:'pointer',textAlign:'left',
                        borderBottom:'1px solid var(--border)'}}>
                <div className="avatar" style={{background:'#007aff',width:36,height:36,fontSize:13,flexShrink:0}}>{initials(u.display_name)}</div>
                <div>
                  <div style={{fontWeight:600,fontSize:14,color:'var(--text)'}}>{u.display_name}</div>
                  <div style={{fontSize:12,color:'var(--text-3)'}}>@{u.username}</div>
                </div>
              </button>
            ))}
          </div>
        )}
      </div>
      {conversations.length === 0 ? (
        <div style={{textAlign:'center',padding:'40px 0',color:'var(--text-3)'}}>
          <div style={{fontSize:36,marginBottom:12}}>💬</div>
          <div style={{fontSize:15,fontWeight:500}}>Sin mensajes aún</div>
          <div style={{fontSize:13,marginTop:6}}>Buscá un usuario arriba para empezar a chatear</div>
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:2}}>
          {conversations.map(conv=>(
            <button key={conv.otherId}
              onClick={()=>{setActiveChat({id:conv.otherId,...conv.profile});setMessages([]);}}
              style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',
                      borderRadius:12,background:'var(--surface)',border:'1px solid var(--border)',
                      cursor:'pointer',textAlign:'left',width:'100%'}}>
              <div className="avatar" style={{background:'#5e5ce6',width:42,height:42,fontSize:14,flexShrink:0}}>{initials(conv.profile.display_name)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:14,color:'var(--text)'}}>{conv.profile.display_name}</div>
                <div style={{fontSize:13,color:'var(--text-3)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{conv.lastMsg}</div>
              </div>
              <div style={{fontSize:11,color:'var(--text-3)',flexShrink:0}}>{timeAgo(conv.lastTime)}</div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── APP SHELL ───────────────────────────────────────────────────────────────
function Sidebar({ route, go, openCreate, user, onSignOut, onProfile, categories, onCreateCategory }) {
  const sidebarCats = categories || CATEGORIES;
  const CAT_COLORS = ['#ff9500','#ff2d55','#5e5ce6','#34c759','#bf5af2','#0a84ff','#ffb340','#bf8a5b'];
  const [showCreateCat, setShowCreateCat] = useState(false);
  const [newCatName,    setNewCatName]    = useState('');
  const [newCatColor,   setNewCatColor]   = useState(CAT_COLORS[0]);
  const [savingCat,     setSavingCat]     = useState(false);

  const handleCreateCat = async () => {
    if (!newCatName.trim()) return;
    setSavingCat(true);
    await onCreateCategory({ name: newCatName.trim(), color: newCatColor });
    setSavingCat(false);
    setShowCreateCat(false);
    setNewCatName(''); setNewCatColor(CAT_COLORS[0]);
  };

  const navItems = [
    {id:'home',label:'Inicio',Icon:IconHome},
    {id:'categorias',label:'Categorías',Icon:IconGrid},
    {id:'mis-menus',label:'Mis menús',Icon:IconBook},
    {id:'amigos',label:'Amigos',Icon:IconUsers},
    {id:'mensajes',label:'Mensajes',Icon:IconChat},
  ];
  const isActive = (id) => {
    if (id==='home') return route.screen==='home';
    if (id==='categorias') return route.screen==='categorias'||route.screen==='category';
    if (id==='mis-menus') return route.screen==='mis-menus'||route.screen==='menu';
    if (id==='amigos') return route.screen==='amigos';
    if (id==='mensajes') return route.screen==='mensajes';
    return false;
  };
  return (
