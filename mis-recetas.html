<link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"Menú","short_name":"Menú","description":"App personal de recetas","start_url":".","scope":".","display":"standalone","orientation":"portrait","background_color":"%23ffffff","theme_color":"%23007aff"}'/>
<style>
  :root{
    --bg:#ffffff;
    --surface:#f5f5f7;
    --surface-2:#ebebef;
    --elevated:#ffffff;
    --border:rgba(60,60,67,.12);
    --border-strong:rgba(60,60,67,.22);
    --text:#1d1d1f;
    --text-2:#6e6e73;
    --text-3:#a1a1a6;
    --accent:#007aff;
    --accent-soft:rgba(0,122,255,.1);
    --danger:#ff3b30;
    --success:#34c759;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
    --shadow-md:0 6px 24px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.04);
    --shadow-lg:0 24px 60px rgba(0,0,0,.10), 0 6px 18px rgba(0,0,0,.06);
    --radius:14px;
    --radius-lg:22px;
    --sidebar-w:264px;
  }
  [data-theme="dark"]{
    --bg:#000000;
    --surface:#1c1c1e;
    --surface-2:#2c2c2e;
    --elevated:#1c1c1e;
    --border:rgba(84,84,88,.4);
    --border-strong:rgba(84,84,88,.7);
    --text:#f5f5f7;
    --text-2:#a1a1a6;
    --text-3:#6e6e73;
    --accent:#0a84ff;
    --accent-soft:rgba(10,132,255,.18);
    --shadow-md:0 6px 24px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
    --shadow-lg:0 24px 60px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    letter-spacing:-0.003em;
    transition:background .25s ease, color .25s ease;
    min-height:100vh;
    min-width:960px;
  }
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
  input, textarea{font-family:inherit;color:inherit}
  ::selection{background:var(--accent-soft)}

  .app{display:flex;min-height:100vh}
  @media (max-width:880px){
    .sidebar{display:none}
    .main{margin-left:0 !important}
  }

  .sidebar{
    position:fixed;top:0;left:0;
    width:var(--sidebar-w);height:100vh;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:22px 14px;
    display:flex;flex-direction:column;gap:6px;
    overflow-y:auto;
    z-index:20;
    flex-shrink:0;
  }
  .main{margin-left:var(--sidebar-w)}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 10px 22px}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,#ff9500,#ff2d55);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;
    letter-spacing:-.02em;box-shadow:0 4px 10px rgba(255,45,85,.25);
  }
  .brand-name{font-size:19px;font-weight:600;letter-spacing:-.02em}
  .nav-section{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:14px 12px 6px}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:7px 11px;border-radius:9px;
    color:var(--text);
    font-size:14px;font-weight:500;
    width:100%;text-align:left;
    transition:background .12s ease;
  }
  .nav-item:hover{background:var(--surface-2)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent)}
  .nav-item .nav-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .nav-item .nav-icon{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--text-2)}
  .nav-item.active .nav-icon{color:var(--accent)}
  .nav-item .nav-count{margin-left:auto;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .sidebar-spacer{flex:1}
  .sidebar-user{
    display:flex;align-items:center;gap:10px;padding:10px;
    border-top:1px solid var(--border);margin-top:8px;
  }
  .avatar{
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,#5ac8fa,#007aff);
    display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;
    flex:none;
  }
  .sidebar-user-meta{display:flex;flex-direction:column;line-height:1.2}
  .sidebar-user-meta strong{font-size:13px;font-weight:600}
  .sidebar-user-meta span{font-size:11px;color:var(--text-2)}

  .main{min-width:0;display:flex;flex-direction:column;flex:1}
  .topbar{
    position:sticky;top:0;z-index:10;
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    background:color-mix(in oklab, var(--bg) 78%, transparent);
    border-bottom:1px solid var(--border);
    padding:12px 36px;
    display:flex;align-items:center;gap:14px;
  }
  .crumbs{font-size:13px;color:var(--text-2);display:flex;gap:6px;align-items:center}
  .crumbs button{color:var(--text-2)}
  .crumbs button:hover{color:var(--text)}
  .crumbs .sep{color:var(--text-3)}
  .crumbs .here{color:var(--text);font-weight:500}
  .topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .icon-btn{
    width:32px;height:32px;border-radius:50%;
    display:grid;place-items:center;
    color:var(--text-2);
    transition:background .12s ease, color .12s ease;
  }
  .icon-btn:hover{background:var(--surface);color:var(--text)}
  .search{
    background:var(--surface);
    border-radius:9px;
    padding:6px 10px;
    display:flex;align-items:center;gap:8px;
    width:240px;color:var(--text-2);
    font-size:13px;
  }
  .search input{background:none;border:none;outline:none;flex:1;font-size:13px}
  @media (max-width:680px){.search{width:auto;flex:1}}

  .content{padding:30px 36px 80px;width:100%}
  @media (max-width:680px){.content{padding:20px}}

  .h-large{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:0}
  .h-section{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
  .h-small{font-size:13px;font-weight:600;letter-spacing:-.005em;margin:0}
  .eyebrow{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin:0}
  .muted{color:var(--text-2)}
  .tabular{font-variant-numeric:tabular-nums}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:34px;padding:0 16px;border-radius:999px;
    font-size:14px;font-weight:500;
    transition:transform .08s ease, opacity .12s ease, background .12s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{opacity:.92}
  .btn-secondary{background:var(--surface);color:var(--text)}
  .btn-secondary:hover{background:var(--surface-2)}
  .btn-ghost{color:var(--accent)}
  .btn-ghost:hover{background:var(--accent-soft)}
  .btn-lg{height:42px;padding:0 22px;font-size:15px;font-weight:600}

  .card{
    background:var(--elevated);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card.clickable{cursor:pointer}
  .card.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-strong)}

  .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px}
  .hero .h-large{font-size:40px}
  .hero .sub{color:var(--text-2);font-size:15px;margin-top:6px}

  .section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:36px 0 14px}
  .section-head .left{display:flex;flex-direction:column;gap:4px}
  .section-head .h-section{font-size:24px}
  .section-head .right{display:flex;gap:6px}

  .cat-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(160px,1fr));gap:12px;
  }
  .cat-card{
    position:relative;overflow:hidden;
    border-radius:18px;border:1px solid var(--border);
    background:var(--elevated);
    aspect-ratio: 5/4;
    padding:14px 16px;
    display:flex;flex-direction:column;justify-content:space-between;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .cat-card .cat-blob{
    position:absolute;right:-22px;bottom:-22px;width:92px;height:92px;border-radius:50%;
    opacity:.85;filter:blur(2px);
  }
  .cat-card .cat-name{font-size:17px;font-weight:600;letter-spacing:-.01em;position:relative}
  .cat-card .cat-meta{font-size:12px;color:var(--text-2);position:relative}

  .feed{display:flex;flex-direction:column;gap:14px}
  .feed-item{display:flex;gap:14px;padding:18px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--elevated)}
  .feed-item .feed-thumb{
    width:104px;height:104px;border-radius:14px;flex:none;
    background:var(--surface);position:relative;overflow:hidden;
  }
  .feed-item .feed-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .feed-item .feed-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
  .feed-item .feed-title{font-size:18px;font-weight:600;letter-spacing:-.01em}
  .feed-item .feed-meta{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin-top:auto}

function normalizeDbRecipe(r, author) {
  const ingredients = (r.recipe_ingredients || [])
    .sort((a,b) => a.position - b.position)
    .map(i => ({ name: i.name, qty: i.qty, unit: i.unit }));
  const steps = (r.recipe_steps || [])
    .sort((a,b) => a.position - b.position)
    .map(s => ({ text: s.text, timer: s.timer_seconds }));
  return {
    id: r.id,
    title: r.title,
    category: r.category_id,
    cover_url: r.cover_url || null,
    cover_color: r.cover_color || null,
    minutes: r.minutes,
    difficulty: r.difficulty,
    servings: r.servings,
    likes: 0,
    description: r.description,
    visibility: r.visibility,
    author_id: r.author_id || null,
    author: author
      ? { name: author.display_name, initials: author.display_name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(), color: '#007aff' }
      : null,
    ingredients,
    steps,
  };
}

function formatAgo(min) {
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min/60);
  if (h < 24) return `hace ${h} h`;
  return `hace ${Math.floor(h/24)} d`;
}

const { useState, useEffect, useRef, useMemo } = React;

function formatTime(s) {
  const m = Math.floor(s/60), ss = s%60;
  return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
}

function scaleQty(qty, target, base) {
  const v = qty * (target/base);
  if (v >= 100) return Math.round(v).toString();
  if (v >= 10)  return (Math.round(v*10)/10).toString();
  return (Math.round(v*100)/100).toString().replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');
}

function FlashQty({ value, flashKey }) {
  const [flash, setFlash] = useState(false);
  const first = useRef(true);
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    setFlash(true);
    const t = setTimeout(() => setFlash(false), 600);
    return () => clearTimeout(t);
  }, [flashKey]);
  return <span className={flash ? 'flash' : ''}>{value}</span>;
}

function RecipeScreen({ recipeId, go, authUser, profile, allRecipes, categories, savedCats, onSaveToCategory, onUnsave, onShare, showToast }) {
  const [recipe, setRecipe] = useState(() => {
    const mock = RECIPES.find(r => r.id === recipeId);
    const db   = (allRecipes||[]).find(r => r.id === recipeId);
    return mock || db || null;
  });
  const [liked,      setLiked]      = useState(false);
  const [likeCount,  setLikeCount]  = useState(recipe?.likes || 0);
  const [saved,      setSaved]      = useState(false);
  const [showSavePicker, setShowSavePicker] = useState(false);
  const [comments,   setComments]   = useState([]);
  const [newComment, setNewComment] = useState('');

  const loadComments = async () => {
    try {
      const { data: cms } = await sb.from('comments')
        .select('id,body,created_at,user_id')
        .eq('recipe_id', recipeId)
        .order('created_at', {ascending:false})
        .limit(20);
      if (!cms?.length) { setComments([]); return; }
      const withProfiles = await Promise.all(cms.map(async cm => {
        try {
          const { data: prof } = await sb.from('profiles').select('display_name,username').eq('id', cm.user_id).maybeSingle();
          return { ...cm, profile: prof };
        } catch(e) { return cm; }
      }));
      setComments(withProfiles);
    } catch(e) {}
  };

  useEffect(() => {
    // Intentar cargar receta completa desde DB (por si es una receta nueva o no está en mock)
    const loadFromDb = async () => {
      try {
        const { data: r } = await sb.from('recipes')
          .select('*, recipe_ingredients(*), recipe_steps(*)')
          .eq('id', recipeId).maybeSingle();
        if (r) {
          const { data: author } = await sb.from('profiles').select('display_name,username,avatar_url').eq('id', r.author_id).maybeSingle();
          setRecipe(normalizeDbRecipe(r, author));
          const { count } = await sb.from('likes').select('*',{count:'exact',head:true}).eq('recipe_id', recipeId);
          setLikeCount(count||0);
        }
      } catch(e) {}
      if (authUser) {
        try {
          const { data: ul } = await sb.from('likes').select('user_id').eq('recipe_id',recipeId).eq('user_id',authUser.id).maybeSingle();
          setLiked(!!ul);
          const { data: us } = await sb.from('saves').select('user_id').eq('recipe_id',recipeId).eq('user_id',authUser.id).maybeSingle();
          setSaved(!!us);
        } catch(e) {}
      }
      await loadComments();
    };
    loadFromDb();
  }, [recipeId, authUser?.id]);

  if (!recipe) return <div className="muted" style={{padding:40}}>Cargando receta…</div>;

  const cat = CATEGORIES.find(c => c.id === (recipe.category||recipe.category_id));
  const VKEY = `recipe-video-${recipe.id}`;
  const [video, setVideo] = useState(() => { try { return localStorage.getItem(VKEY)||''; } catch(e){ return ''; } });
  const [askVideo, setAskVideo] = useState(false);
  const [videoInput, setVideoInput] = useState('');

  const saveVideo = (url) => {
    setVideo(url);
    try { url ? localStorage.setItem(VKEY,url) : localStorage.removeItem(VKEY); } catch(e){}
  };

  const embedSrc = (url) => {
    if (!url) return null;
    let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
    if (m) return { type:'iframe', src:`https://www.youtube.com/embed/${m[1]}` };
    m = url.match(/vimeo\.com\/(\d+)/);
    if (m) return { type:'iframe', src:`https://player.vimeo.com/video/${m[1]}` };
    if (/\.(mp4|webm|mov|m4v)(\?|$)/i.test(url)) return { type:'video', src:url };
    return { type:'iframe', src:url };
  };
  const embed = embedSrc(video);

  const [servings, setServings] = useState(recipe.servings);
  const [flashKey, setFlashKey] = useState(0);
  const [checked, setChecked] = useState({});
  const [activeStep, setActiveStep] = useState(null);
  const [doneSteps, setDoneSteps] = useState({});
  const [timeLeft, setTimeLeft] = useState(0);
  const [running, setRunning] = useState(false);
  const [stageLabel, setStageLabel] = useState('Listo');
  const intervalRef = useRef(null);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setTimeLeft(t => {
        if (t <= 1) {
          clearInterval(intervalRef.current);
          setRunning(false);
          if (activeStep !== null) setDoneSteps(s => ({...s, [activeStep]: true}));
          try {
            const ctx = new (window.AudioContext||window.webkitAudioContext)();
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = 880; g.gain.value = 0.15;
            o.start(); setTimeout(()=>{o.stop(); ctx.close();}, 280);
          } catch(e){}
          return 0;
        }
        return t-1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running, activeStep]);

  const startStepTimer = (idx) => {
    const step = recipe.steps[idx];
    if (!step.timer) return;
    setActiveStep(idx);
    setStageLabel(`Paso ${idx+1}`);
    setTimeLeft(step.timer);
    setRunning(true);
  };

  const toggleTimer = () => { if (timeLeft !== 0) setRunning(r => !r); };
  const resetTimer = () => {
    setRunning(false);
    if (activeStep !== null && recipe.steps[activeStep].timer) setTimeLeft(recipe.steps[activeStep].timer);
    else setTimeLeft(0);
  };

  const totalDuration = activeStep !== null && recipe.steps[activeStep]?.timer ? recipe.steps[activeStep].timer : 1;
  const ringProgress = activeStep !== null ? (1 - timeLeft/totalDuration) : 0;
  const C = 2 * Math.PI * 88;

  const onServings = (s) => { setServings(s); setFlashKey(k => k+1); };

  const handleToggleLike = async () => {
    if (!authUser) { showToast && showToast('Iniciá sesión para dar likes'); return; }
    if (liked) {
      await sb.from('likes').delete().eq('recipe_id',recipeId).eq('user_id',authUser.id);
      setLiked(false); setLikeCount(c=>Math.max(0,c-1));
    } else {
      await sb.from('likes').insert({recipe_id:recipeId,user_id:authUser.id});
      setLiked(true); setLikeCount(c=>c+1);
    }
  };

  const isSaved = savedCats && recipeId in savedCats;
  const savedCatId = savedCats?.[recipeId];
  const savedCatObj = categories?.find(c => c.id === savedCatId);

  const handleSaveClick = () => {
    if (!authUser) { showToast && showToast('Iniciá sesión para guardar'); return; }
    if (isSaved) {
      onUnsave && onUnsave(recipeId);
      setSaved(false);
    } else {
      setShowSavePicker(true);
    }
  };
  const handlePickCategory = (catId) => {
    onSaveToCategory && onSaveToCategory(recipeId, catId);
    setSaved(true);
    setShowSavePicker(false);
  };

  return (
    <div>
      <div className="recipe-hero">
        <Placeholder label={`foto · ${recipe.title.toLowerCase()}`} color={cat.color}/>
        <div style={{position:'absolute',top:14,left:14,pointerEvents:'none',zIndex:2}}>
          <span className="pill" style={{background:'rgba(0,0,0,.55)',color:'#fff',backdropFilter:'blur(8px)'}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:cat.color,display:'inline-block'}}/> {cat.name}
          </span>
        </div>
      </div>

      {embed && (
        <div className="recipe-video">
          {embed.type==='iframe'
            ? <iframe src={embed.src} allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen/>
            : <video src={embed.src} controls/>}
          <button className="video-clear" onClick={()=>saveVideo('')} title="Quitar video"><IconMinus size={14} strokeWidth={2.4}/></button>
        </div>
      )}

      <div className="attach-row">
        <button className="btn btn-secondary" onClick={()=>{ setVideoInput(video); setAskVideo(true); }}>
          <IconPlay size={12}/> {video?'Cambiar video':'Adjuntar video'}
        </button>
      </div>

      {askVideo && (
        <div className="modal-backdrop" onClick={()=>setAskVideo(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{width:'min(460px,calc(100vw - 32px))'}}>
            <h2>Adjuntar video</h2>
            <p className="modal-sub">Pegá un enlace de YouTube, Vimeo o un archivo .mp4/.webm.</p>
            <div className="field">
              <label>URL</label>
              <input className="input" autoFocus value={videoInput} onChange={e=>setVideoInput(e.target.value)} placeholder="https://youtube.com/watch?v=..."/>
            </div>
            <div className="modal-actions">
              {video && <button className="btn btn-secondary" style={{marginRight:'auto',color:'var(--danger)'}} onClick={()=>{ saveVideo(''); setAskVideo(false); }}>Quitar</button>}
              <button className="btn btn-secondary" onClick={()=>setAskVideo(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={()=>{ saveVideo(videoInput.trim()); setAskVideo(false); }}>Guardar</button>
            </div>
          </div>
        </div>
      )}

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:16,flexWrap:'wrap'}}>
        <div style={{flex:'1 1 380px'}}>
          <h1 className="h-large" style={{fontSize:34,marginTop:6}}>{recipe.title}</h1>
          <p style={{margin:'10px 0 0',fontSize:15,color:'var(--text-2)',lineHeight:1.55,maxWidth:620}}>{recipe.description}</p>
          <div className="recipe-meta-row">
            <span><IconClock size={13}/> <strong>{recipe.minutes}</strong> min</span>
            <span>·</span><span><strong>{recipe.difficulty}</strong></span>
            <span>·</span><span><IconUsersS size={13}/> <strong>{recipe.servings}</strong> porciones base</span>
          </div>
          {recipe.author && <div
            style={{display:'flex',alignItems:'center',gap:10,marginTop:18,cursor:recipe.author_id?'pointer':'default'}}
            onClick={()=>recipe.author_id && go({screen:'user-profile',id:recipe.author_id,name:recipe.author.name})}>
            <div className="avatar" style={{background:recipe.author.color||'#007aff',width:34,height:34,fontSize:13}}>{recipe.author.initials}</div>
            <div>
              <div style={{fontSize:13.5,fontWeight:600}}>{recipe.author.name}</div>
              <div style={{fontSize:12,color:'var(--text-2)'}}>{recipe.author_id ? 'Ver perfil →' : 'Receta original'}</div>
            </div>
          </div>}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:6,alignItems:'flex-end'}}>
          <div style={{display:'flex',gap:8}}>
            <button className={"btn "+(liked?'btn-primary':'btn-secondary')} onClick={handleToggleLike}>
              {liked ? <IconHeartFill size={14}/> : <IconHeart size={14}/>}
              {likeCount}
            </button>
            <button className={"btn "+(isSaved?'btn-primary':'btn-secondary')} onClick={handleSaveClick}>
              <IconBookmark size={14}/> {isSaved?'Guardado':'Guardar'}
            </button>
            <button className="btn btn-secondary" onClick={onShare}><IconShare size={14}/> Compartir</button>
          </div>
          {isSaved && savedCatObj && (
            <div style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--text-2)'}}>
              <span style={{width:7,height:7,borderRadius:'50%',background:savedCatObj.color,display:'inline-block'}}/>
              Guardado en <strong style={{color:'var(--text)'}}>{savedCatObj.name}</strong>
              <button onClick={()=>handleSaveClick()} style={{background:'none',border:'none',cursor:'pointer',
                color:'var(--text-3)',fontSize:11,padding:'0 2px',lineHeight:1}}>× quitar</button>
            </div>
          )}
          {isSaved && !savedCatObj && (
            <div style={{fontSize:12,color:'var(--text-2)'}}>
              Guardado · <button onClick={()=>handleSaveClick()} style={{background:'none',border:'none',cursor:'pointer',
                color:'var(--text-3)',fontSize:11,padding:0}}>quitar</button>
            </div>
          )}
        </div>
      </div>

      {showSavePicker && (
        <div className="modal-backdrop" onClick={()=>setShowSavePicker(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h2>Guardar en categoría</h2>
            <p className="modal-sub">Elegí en cuál de tus categorías querés guardar esta receta.</p>
            <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:320,overflowY:'auto'}}>
              {(categories||[]).map(cat => (
                <button key={cat.id} onClick={()=>handlePickCategory(cat.id)}
                  style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',borderRadius:12,
                    border:'1.5px solid var(--border)',background:'var(--surface-2)',cursor:'pointer',textAlign:'left',
                    transition:'background .12s'}}
                  onMouseEnter={e=>e.currentTarget.style.background='var(--surface)'}
                  onMouseLeave={e=>e.currentTarget.style.background='var(--surface-2)'}>
                  <span style={{width:12,height:12,borderRadius:'50%',background:cat.color,flexShrink:0}}/>
                  <span style={{fontWeight:500,fontSize:14,color:'var(--text)'}}>{cat.name}</span>
                  {cat.count > 0 && <span style={{marginLeft:'auto',fontSize:12,color:'var(--text-3)'}}>{cat.count} recetas</span>}
                </button>
              ))}
              {(!categories || categories.length === 0) && (
                <p style={{textAlign:'center',color:'var(--text-3)',fontSize:13,padding:'20px 0'}}>
                  No tenés categorías todavía. Creá una desde la sección Categorías.
                </p>
              )}
            </div>
            <div className="modal-actions">
              <button className="btn btn-secondary" onClick={()=>setShowSavePicker(false)}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      <div className="recipe" style={{marginTop:36}}>
        <div>
          <div className="recipe-section" style={{marginTop:0}}>
            <h3>Preparación</h3>
            <ul className="step-list">
              {recipe.steps.map((step,i) => {
                const isActive = activeStep===i && running;
                const isDone = !!doneSteps[i];
                return (
                  <li key={i} className={"step "+(isActive?'active':'')+' '+(isDone?'done':'')}>
                    <div className="step-num">{isDone ? <IconCheck size={13} stroke="#fff"/> : i+1}</div>
                    <div className="step-thumb">
                      <Placeholder label={`paso ${i+1}`} color={cat.color}/>
                    </div>
                    <div className="step-text">{step.text}</div>
                    {step.timer
                      ? <button className={"step-timer-btn "+(isActive?'running':'')} onClick={()=>startStepTimer(i)}>
                          <IconClock size={12}/> {Math.round(step.timer/60)} min
                        </button>
                      : <span style={{width:1}}/>}
                  </li>
                );
              })}
            </ul>
          </div>

          <div className="recipe-section">
            <h3>Comentarios <span style={{color:'var(--text-3)',fontWeight:400,fontSize:14}}>· {comments.length}</span></h3>
            {authUser ? (
              <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                <div className="avatar" style={{background:'#5e5ce6',width:32,height:32,fontSize:12,flexShrink:0}}>
                  {profile ? profile.display_name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() : (authUser.email||'?')[0].toUpperCase()}
                </div>
                <div style={{flex:1,display:'flex',gap:8,alignItems:'center'}}>
                  <input className="input" style={{flex:1}} placeholder="Agregá un comentario..."
                         value={newComment} onChange={e=>setNewComment(e.target.value)}
                         onKeyDown={async e=>{
                           if(e.key==='Enter'&&!e.shiftKey&&newComment.trim()){
                             e.preventDefault();
                             const body=newComment.trim(); setNewComment('');
                             try { await sb.from('comments').insert({recipe_id:recipeId,user_id:authUser.id,body}); await loadComments(); } catch(err){}
                           }
                         }}/>
                  <button className="btn btn-primary" style={{height:38,padding:'0 14px',borderRadius:10,flexShrink:0,fontSize:13}}
                    onClick={async ()=>{
                      if(!newComment.trim()) return;
                      const body=newComment.trim(); setNewComment('');
                      try { await sb.from('comments').insert({recipe_id:recipeId,user_id:authUser.id,body}); await loadComments(); } catch(err){}
                    }}>
                    Enviar
                  </button>
                </div>
              </div>
            ) : (
              <div style={{padding:'12px 16px',borderRadius:10,background:'var(--surface)',fontSize:13,color:'var(--text-2)'}}>
                Iniciá sesión para comentar
              </div>
            )}
            <div style={{marginTop:18,display:'flex',flexDirection:'column',gap:14}}>
              {comments.map((cm)=>{
                const name = cm.profile?.display_name || 'Usuario';
                const initials = name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
                const timeAgo = (() => {
                  const diff = (new Date() - new Date(cm.created_at))/1000;
                  if(diff<60) return 'ahora';
                  if(diff<3600) return `hace ${Math.floor(diff/60)} min`;
                  if(diff<86400) return `hace ${Math.floor(diff/3600)} h`;
                  return `hace ${Math.floor(diff/86400)} d`;
                })();
                return (
                  <div key={cm.id} style={{display:'flex',gap:10}}>
                    <div className="avatar" style={{background:'#5e5ce6',width:32,height:32,fontSize:12,flexShrink:0,cursor:cm.user_id?'pointer':'default'}}
                      onClick={()=>cm.user_id && go({screen:'user-profile',id:cm.user_id,name})}>{initials}</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:600,cursor:cm.user_id?'pointer':'default'}}
                        onClick={()=>cm.user_id && go({screen:'user-profile',id:cm.user_id,name})}>
                        {name} <span style={{color:'var(--text-3)',fontWeight:400,marginLeft:6}}>{timeAgo}</span></div>
                      <div style={{fontSize:14,color:'var(--text-2)',marginTop:2,lineHeight:1.5}}>{cm.body}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        <div className="recipe-side">
          <div className="timer-card">
            <div className="label">{stageLabel}</div>
            <div className="timer-ring">
              <svg viewBox="0 0 200 200">
                <circle className="track" cx="100" cy="100" r="88"/>
                <circle className="progress" cx="100" cy="100" r="88"
                        strokeDasharray={C} strokeDashoffset={C*(1-ringProgress)}/>
              </svg>
              <div className="timer-digits">
                <div className="time">{formatTime(timeLeft)}</div>
                <div className="stage">
                  {activeStep !== null ? `Paso ${activeStep+1} de ${recipe.steps.length}` : 'Tocá un paso para iniciar'}
                </div>
              </div>
            </div>
            <div className="timer-controls">
              <button className="timer-btn" onClick={resetTimer} title="Reiniciar"><IconReset size={16}/></button>
              <button className="timer-btn primary" onClick={toggleTimer} disabled={timeLeft===0}>
                {running ? <IconPause size={20}/> : <IconPlay size={20}/>}
              </button>
              <button className="timer-btn" onClick={()=>{
                const next = recipe.steps.findIndex((s,i)=>i>(activeStep??-1)&&s.timer);
                if (next !== -1) startStepTimer(next);
              }} title="Siguiente paso"><IconChevR size={16}/></button>
            </div>
          </div>

          <div className="ingredients-card">
            <div className="ing-head">
              <h3>Ingredientes</h3>
              <div className="stepper">
                <button onClick={()=>{ const idx=SERVING_OPTIONS.indexOf(servings); if(idx>0) onServings(SERVING_OPTIONS[idx-1]); }}
                        disabled={SERVING_OPTIONS.indexOf(servings)===0}>
                  <IconMinus size={14} strokeWidth={2.4}/>
                </button>
                <div className="val">{servings} {servings===1?'porción':'porciones'}</div>
                <button onClick={()=>{ const idx=SERVING_OPTIONS.indexOf(servings); if(idx<SERVING_OPTIONS.length-1) onServings(SERVING_OPTIONS[idx+1]); }}
                        disabled={SERVING_OPTIONS.indexOf(servings)===SERVING_OPTIONS.length-1}>
                  <IconPlus size={14} strokeWidth={2.4}/>
                </button>
              </div>
            </div>
            <ul className="ing-list">
              {recipe.ingredients.map((ing,i) => {
                const isOn = !!checked[i];
                return (
                  <li key={i} className={"ing "+(isOn?'on':'')} onClick={()=>setChecked(c=>({...c,[i]:!c[i]}))}>
                    <div className="check"><IconCheck size={12} stroke="#fff" strokeWidth={2.4}/></div>
                    <div className="ing-name">{ing.name}</div>
                    <div className="ing-qty" key={flashKey+'-'+i}>
                      <FlashQty value={`${scaleQty(ing.qty,servings,recipe.servings)} ${ing.unit}`} flashKey={flashKey}/>
                    </div>
                  </li>
                );
              })}
            </ul>
            <div style={{marginTop:14,padding:'10px 12px',background:'var(--accent-soft)',borderRadius:10,fontSize:12,color:'var(--accent)',display:'flex',alignItems:'center',gap:8}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:'var(--accent)',display:'inline-block'}}/>
              Cantidades para {servings} {servings===1?'porción':'porciones'}.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── SCREENS ─────────────────────────────────────────────────────────────────
function MenuCard({ menu, go, onDelete, onUpdate }) {
  const COLORS = ['#ff9500','#ff2d55','#5e5ce6','#34c759','#bf5af2','#0a84ff','#ffb340','#30d158'];
  const recipeCount = menu.recipes?.length || 0;
  const visLabel = {public:'Público',friends:'Amigos',private:'Privado'}[menu.visibility];
  const [confirmDel, setConfirmDel] = useState(false);

  // ── edición inline
  const [editing,    setEditing]    = useState(false);
  const [editTitle,  setEditTitle]  = useState('');
  const [editCover,  setEditCover]  = useState('');
  const [editCoverUrl, setEditCoverUrl] = useState(null);
  const [editVis,    setEditVis]    = useState('friends');
  const uploadIdRef = React.useRef(0);

  const openEdit = (e) => {
    e.stopPropagation();
    setEditTitle(menu.title);
    setEditCover(menu.cover);
    setEditCoverUrl(menu.cover_url || null);
    setEditVis(menu.visibility || 'friends');
    setEditing(true);
  };
  const saveEdit = () => {
    if (!editTitle.trim()) return;
    onUpdate && onUpdate(menu.id, { title: editTitle, cover: editCover, cover_url: editCoverUrl, visibility: editVis });
    setEditing(false);
  };
  const clearCover = () => { setEditCoverUrl(null); uploadIdRef.current++; };
  const handleCoverUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const uid = ++uploadIdRef.current;
    const localUrl = URL.createObjectURL(file);
    setEditCoverUrl(localUrl);
    const path = `menu-${menu.id}-${Date.now()}.${file.name.split('.').pop()}`;
    const { error } = await sb.storage.from('menu-covers').upload(path, file, { contentType: file.type, upsert: true });
    if (!error && uploadIdRef.current === uid) {
      const { data: { publicUrl } } = sb.storage.from('menu-covers').getPublicUrl(path);
      URL.revokeObjectURL(localUrl);
      setEditCoverUrl(publicUrl);
    }
  };

  const hasCover = !!menu.cover_url;

  return (
    <>
      <div className="menu-card cat-card" style={{position:'relative'}} onClick={()=>go({screen:'menu',id:menu.id})}>
        <div className="menu-cover" style={{position:'relative',overflow:'hidden'}}>
          {hasCover
            ? <img src={menu.cover_url} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
            : <Placeholder label={menu.title.toLowerCase()} color={menu.cover}/>}
        </div>
        <div className="menu-card-body">
          <div className="menu-title">{menu.title}</div>
          <div className="menu-meta">
            <span>{recipeCount} recetas</span> · <span>{menu.likes || 0} ♥</span>
            <span className={"pill "+(menu.visibility==='public'?'public':'')} style={{marginLeft:'auto'}}>{visLabel}</span>
          </div>
        </div>
        {confirmDel ? (
          <div className="cat-actions" style={{position:'absolute',top:8,right:8,display:'flex',gap:4,opacity:1}}
            onClick={e=>e.stopPropagation()}>
            <span style={{fontSize:11,color:'var(--danger)',fontWeight:600,alignSelf:'center'}}>¿Eliminar?</span>
            <button onClick={()=>setConfirmDel(false)}
              style={{height:26,padding:'0 10px',borderRadius:20,background:'var(--surface-2)',
                color:'var(--text-2)',border:'none',cursor:'pointer',fontSize:12}}>No</button>
            <button onClick={()=>onDelete && onDelete(menu.id)}
              style={{height:26,padding:'0 10px',borderRadius:20,background:'var(--danger)',
                color:'#fff',border:'none',cursor:'pointer',fontSize:12,fontWeight:600}}>Sí</button>
          </div>
        ) : (
          <div className="cat-actions" style={{position:'absolute',top:8,right:8,display:'flex',gap:4}}
            onClick={e=>e.stopPropagation()}>
            {onUpdate && (
              <button onClick={openEdit} title="Editar menú"
                style={{width:28,height:28,borderRadius:'50%',
                  background: hasCover ? 'rgba(0,0,0,.4)' : 'var(--surface-2)',
                  color: hasCover ? '#fff' : 'var(--text-2)',
                  border:'none',cursor:'pointer',display:'grid',placeItems:'center',
                  backdropFilter: hasCover ? 'blur(4px)' : 'none'}}>
                <IconEdit size={13}/>
              </button>
            )}
            {onDelete && (
              <button onClick={()=>setConfirmDel(true)} title="Eliminar menú"
                style={{width:28,height:28,borderRadius:'50%',background:'rgba(200,0,0,.5)',
                  color:'#fff',border:'none',cursor:'pointer',display:'grid',placeItems:'center',
                  backdropFilter:'blur(4px)'}}>
                <IconTrash size={13}/>
              </button>
            )}
          </div>
        )}
      </div>

      {editing && (
        <div className="modal-backdrop" onClick={()=>setEditing(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h2>Editar menú</h2>
            <div className="field">
              <label>Nombre *</label>
              <input className="input" autoFocus value={editTitle} onChange={e=>setEditTitle(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&saveEdit()}/>
            </div>
            <div className="field">
              <label>Color de portada</label>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {COLORS.map(c => (
                  <button key={c} onClick={()=>setEditCover(c)}
                    style={{width:32,height:32,borderRadius:'50%',background:c,border:'none',cursor:'pointer',
                      outline:editCover===c?'2.5px solid var(--text)':'none',outlineOffset:2}}/>
                ))}
              </div>
              {!editCoverUrl && (
                <div style={{height:52,borderRadius:12,marginTop:10,background:editCover,
                  display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <span style={{fontSize:13,fontWeight:600,color:'rgba(255,255,255,.85)',textShadow:'0 1px 3px rgba(0,0,0,.4)'}}>
                    {editTitle || menu.title}
                  </span>
                </div>
              )}
            </div>
            <div className="field">
              <label>Foto de portada <span style={{color:'var(--text-3)',fontWeight:400,fontSize:12}}>(opcional)</span></label>
              <input type="file" accept="image/*" id={`mc-upload-${menu.id}`} style={{display:'none'}} onChange={handleCoverUpload}/>
              {editCoverUrl ? (
                <div style={{position:'relative',aspectRatio:'16/9',borderRadius:12,overflow:'hidden',marginTop:6}}>
                  <img src={editCoverUrl} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                  <button type="button" onClick={clearCover}
                    style={{position:'absolute',top:8,right:8,width:26,height:26,borderRadius:'50%',
                      background:'rgba(0,0,0,.5)',border:'none',cursor:'pointer',color:'#fff',fontSize:14,
                      display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
                </div>
              ) : (
                <label htmlFor={`mc-upload-${menu.id}`}
                  style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,
                    border:'1.5px dashed var(--border)',cursor:'pointer',marginTop:6,color:'var(--text-2)',fontSize:13}}>
                  <IconPlus size={16}/> Subir foto
                </label>
              )}
            </div>
            <div className="field">
              <label>Visibilidad</label>
              <div className="visibility-row">
                {[['private','Privado'],['friends','Amigos'],['public','Público']].map(([k,l])=>(
                  <button key={k} className={editVis===k?'on':''} onClick={()=>setEditVis(k)}>{l}</button>
                ))}
              </div>
            </div>
            <div className="modal-actions">
              <button className="btn btn-secondary" onClick={()=>setEditing(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={saveEdit} disabled={!editTitle.trim()}>Guardar</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function HomeScreen({ go, likes, toggleLike, openCreate, openCreateMenu, categories, recipes, profile }) {
  const featured = recipes.find(r => r.id==='pesto') || recipes[0];
  const trendingMenu = MENUS_INIT[0];

function CategoryScreen({ categoryId, go, categories, recipes, catRecs, onUpdateCatRecs, authUser }) {
  const allRecipes = recipes || RECIPES;
  const cat = (categories||CATEGORIES).find(c => c.id===categoryId) || {id:categoryId,name:categoryId,color:'#007aff',count:0};
  const cr = (catRecs||{})[categoryId] || {};
  const hiddenRecs = cr.hidden || [];
  const extraRecs  = cr.extra  || [];

  const baseRecipes  = allRecipes.filter(r => (r.category||r.category_id)===categoryId && !hiddenRecs.includes(r.id));
  const baseIds      = baseRecipes.map(r => r.id);
  const extraRecipes = extraRecs.map(id => allRecipes.find(r=>r.id===id)).filter(Boolean).filter(r => !baseIds.includes(r.id));
  const catRecipes   = [...baseRecipes, ...extraRecipes];

  const [editing, setEditing] = useState(false);
  const [pendingHidden, setPendingHidden] = useState(hiddenRecs);
  const [pendingExtra,  setPendingExtra]  = useState(extraRecs);
  const [search, setSearch] = useState('');

  const openEdit = () => {
    setPendingHidden([...hiddenRecs]);
    setPendingExtra([...extraRecs]);
    setSearch('');
    setEditing(true);
  };

  const isChecked = (r) => {
    const natural = (r.category||r.category_id) === categoryId;
    if (natural) return !pendingHidden.includes(r.id);
    return pendingExtra.includes(r.id);
  };

  const toggle = (r) => {
    const natural = (r.category||r.category_id) === categoryId;
    if (natural) {
      setPendingHidden(prev => prev.includes(r.id) ? prev.filter(id=>id!==r.id) : [...prev, r.id]);
    } else {
      setPendingExtra(prev => prev.includes(r.id) ? prev.filter(id=>id!==r.id) : [...prev, r.id]);
    }
  };

  const saveEdit = () => {
    onUpdateCatRecs && onUpdateCatRecs(categoryId, {extra: pendingExtra, hidden: pendingHidden});
    setEditing(false);
  };

  const filtered = search.trim()
    ? allRecipes.filter(r => r.title.toLowerCase().includes(search.trim().toLowerCase()))
    : allRecipes;

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:6}}>
        <div style={{width:52,height:52,borderRadius:14,background:cat.color,opacity:.85}}/>
        <div style={{flex:1}}>
          <p className="eyebrow" style={{margin:0}}>Categoría</p>
          <h1 className="h-large" style={{fontSize:36}}>{cat.name}</h1>
        </div>
        {authUser && (
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-secondary" style={{gap:6}} onClick={openEdit}>
              <IconEdit size={13}/> Editar
            </button>
            <button className="btn btn-primary" style={{gap:6}}
              onClick={()=>go({screen:'create-recipe', addToCategory: categoryId})}>
              <IconPlus size={13}/> Nueva receta
            </button>
          </div>
        )}
      </div>
      <p className="muted" style={{fontSize:14,marginTop:8}}>{catRecipes.length} recetas</p>
      <div style={{marginTop:24,display:'flex',flexDirection:'column',gap:4}}>
        {catRecipes.length===0
          ? <div className="card" style={{textAlign:'center',padding:42,color:'var(--text-2)'}}><p style={{margin:0}}>Pronto traemos más recetas.</p></div>
          : catRecipes.map(r => (
            <div key={r.id} className="recipe-row" onClick={()=>go({screen:'recipe',id:r.id})}>
              <div className="rr-thumb"><Placeholder label={r.title.toLowerCase()} color={cat.color}/></div>
              <div>
                <div className="rr-title">{r.title}</div>
                <div className="rr-meta">
                  <span><IconClock size={11}/> {r.minutes} min</span>
                  <span>· {r.difficulty}</span>
                  {r.author && <span>· {r.author.name}</span>}
                </div>
              </div>
              <IconChevR size={16} stroke="var(--text-3)"/>
            </div>
          ))}
      </div>

      {editing && (
        <div className="modal-backdrop" onClick={()=>setEditing(false)}>
          <div className="modal" style={{width:'min(540px,calc(100vw - 32px))',maxHeight:'85vh',display:'flex',flexDirection:'column'}}
            onClick={e=>e.stopPropagation()}>
            <h2 style={{marginBottom:4}}>Editar recetas</h2>
            <p className="modal-sub" style={{marginBottom:14}}>Seleccioná qué recetas aparecen en <strong>{cat.name}</strong>.</p>
            <input className="input" placeholder="Buscar receta..." value={search} onChange={e=>setSearch(e.target.value)}
              style={{marginBottom:12}}/>
            <div style={{overflowY:'auto',flex:1,display:'flex',flexDirection:'column',gap:4}}>
              {filtered.map(r => {
                const checked = isChecked(r);
                const natural = (r.category||r.category_id) === categoryId;
                const otherCat = (categories||CATEGORIES).find(c=>c.id===(r.category||r.category_id));
                return (
                  <label key={r.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:10,
                    cursor:'pointer',background: checked ? 'color-mix(in oklab,var(--accent) 8%,transparent)' : 'var(--surface-2)',
                    border: checked ? '1.5px solid color-mix(in oklab,var(--accent) 30%,transparent)' : '1.5px solid transparent',
                    transition:'background .12s,border .12s'}}>
                    <input type="checkbox" checked={checked} onChange={()=>toggle(r)}
                      style={{width:16,height:16,accentColor:'var(--accent)',cursor:'pointer',flexShrink:0}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:500,color:'var(--text)'}}>{r.title}</div>
                      <div style={{fontSize:12,color:'var(--text-3)',display:'flex',gap:6,marginTop:1}}>
                        <span><IconClock size={10}/> {r.minutes} min</span>
                        <span>· {r.difficulty}</span>
                        {!natural && otherCat && <span style={{color:'var(--accent)'}}>· De {otherCat.name}</span>}
                      </div>
                    </div>
                    {natural && <span style={{fontSize:11,padding:'2px 7px',borderRadius:20,
                      background:'color-mix(in oklab,var(--accent) 14%,transparent)',color:'var(--accent)',fontWeight:600}}>
                      Original
                    </span>}
                  </label>
                );
              })}
            </div>
            <div className="modal-actions" style={{marginTop:14}}>
              <button className="btn btn-secondary" onClick={()=>setEditing(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={saveEdit}>Guardar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MenuDetailScreen({ menuId, go, userMenus, allRecipes, categories, onUpdateRecipes, onUpdateMenu }) {
  const menu = userMenus.find(m => m.id===menuId) || MENUS_INIT.find(m => m.id===menuId);
  if (!menu) return <div className="card">Menú no encontrado</div>;

  const recipePool = allRecipes || RECIPES;
  const catPool    = categories || CATEGORIES;
  const recipes = menu.recipes.map(id => recipePool.find(r=>r.id===id)).filter(Boolean);

  const COLORS = ['#ff9500','#ff2d55','#5e5ce6','#34c759','#bf5af2','#0a84ff','#ffb340','#30d158'];

  // ── editar recetas
  const [editing,  setEditing]  = useState(false);
  const [pending,  setPending]  = useState([]);
  const [search,   setSearch]   = useState('');

  const openEdit = () => { setPending([...menu.recipes]); setSearch(''); setEditing(true); };
  const isIn = (id) => pending.includes(id);
  const toggle = (id) => setPending(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  const saveEdit = () => { onUpdateRecipes && onUpdateRecipes(menuId, pending); setEditing(false); };
  const filtered = search.trim()
    ? recipePool.filter(r => r.title.toLowerCase().includes(search.trim().toLowerCase()))
    : recipePool;

  // ── editar info del menú
  const [editInfo,     setEditInfo]     = useState(false);
  const [editTitle,    setEditTitle]    = useState('');
  const [editCover,    setEditCover]    = useState('');
  const [editCoverUrl, setEditCoverUrl] = useState(null);
  const [editVis,      setEditVis]      = useState('friends');
  const infoUploadIdRef = React.useRef(0);

  const openEditInfo = () => {
    setEditTitle(menu.title);
    setEditCover(menu.cover);
    setEditCoverUrl(menu.cover_url || null);
    setEditVis(menu.visibility || 'friends');
    setEditInfo(true);
  };
  const saveInfo = () => {
    if (!editTitle.trim()) return;
    onUpdateMenu && onUpdateMenu(menuId, {title: editTitle, cover: editCover, cover_url: editCoverUrl, visibility: editVis});
    setEditInfo(false);
  };
  const clearInfoCover = () => { setEditCoverUrl(null); infoUploadIdRef.current++; };
  const handleMenuCoverUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const uid = ++infoUploadIdRef.current;
    const localUrl = URL.createObjectURL(file);
    setEditCoverUrl(localUrl);
    const path = `menu-${menuId}-${Date.now()}.${file.name.split('.').pop()}`;
    const { error } = await sb.storage.from('menu-covers').upload(path, file, { contentType: file.type, upsert: true });
    if (!error && infoUploadIdRef.current === uid) {
      const { data: { publicUrl } } = sb.storage.from('menu-covers').getPublicUrl(path);
      URL.revokeObjectURL(localUrl);
      setEditCoverUrl(publicUrl);
    }
  };

  return (
    <div>
      <div className="recipe-hero" style={{aspectRatio:'21/9',overflow:'hidden'}}>
        {menu.cover_url
          ? <img src={menu.cover_url} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
          : <Placeholder label={menu.title.toLowerCase()} color={menu.cover}/>}
      </div>
      <div className="hero" style={{marginTop:18,marginBottom:18}}>
        <div>
          <p className="eyebrow">Menú · {menu.author}</p>
          <h1 className="h-large">{menu.title}</h1>
          <div className="recipe-meta-row">
            <span><strong>{recipes.length}</strong> recetas</span>
            <span>·</span>
            <span><IconHeart size={13}/> {menu.likes}</span>
          </div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary" onClick={openEditInfo}><IconEdit size={14}/> Editar</button>
          <button className="btn btn-secondary" onClick={openEdit}><IconPlus size={14}/> Recetas</button>
          <button className="btn btn-primary" onClick={()=>go({screen:'create-recipe',addToMenu:menuId})}>
            <IconPlus size={14}/> Nueva receta
          </button>
        </div>
      </div>

      {/* ── Modal editar info ── */}
      {editInfo && (
        <div className="modal-backdrop" onClick={()=>setEditInfo(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h2>Editar menú</h2>
            <div className="field">
              <label>Nombre *</label>
              <input className="input" autoFocus value={editTitle} onChange={e=>setEditTitle(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&saveInfo()}/>
            </div>
            <div className="field">
              <label>Color de portada</label>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {COLORS.map(c => (
                  <button key={c} onClick={()=>setEditCover(c)}
                    style={{width:32,height:32,borderRadius:'50%',background:c,border:'none',cursor:'pointer',
                      outline: editCover===c ? '2.5px solid var(--text)' : 'none', outlineOffset:2}}/>
                ))}
              </div>
              {!editCoverUrl && (
                <div style={{height:52,borderRadius:12,marginTop:10,background:editCover,
                  display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <span style={{fontSize:13,fontWeight:600,color:'rgba(255,255,255,.85)',textShadow:'0 1px 3px rgba(0,0,0,.4)'}}>
                    {editTitle || menu.title}
                  </span>
                </div>
              )}
            </div>
            <div className="field">
              <label>Foto de portada <span style={{color:'var(--text-3)',fontWeight:400,fontSize:12}}>(opcional)</span></label>
              <input type="file" accept="image/*" id="menu-cover-upload" style={{display:'none'}} onChange={handleMenuCoverUpload}/>
              {editCoverUrl ? (
                <div style={{position:'relative',aspectRatio:'16/9',borderRadius:12,overflow:'hidden',marginTop:6}}>
                  <img src={editCoverUrl} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                  <button type="button" onClick={clearInfoCover}
                    style={{position:'absolute',top:8,right:8,width:26,height:26,borderRadius:'50%',
                      background:'rgba(0,0,0,.5)',border:'none',cursor:'pointer',color:'#fff',fontSize:14,
                      display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
                </div>
              ) : (
                <label htmlFor="menu-cover-upload"
                  style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,
                    border:'1.5px dashed var(--border)',cursor:'pointer',marginTop:6,color:'var(--text-2)',fontSize:13}}>
                  <IconPlus size={16}/> Subir foto
                </label>
              )}
            </div>
            <div className="field">
              <label>Visibilidad</label>
              <div className="visibility-row">
                {[['private','Privado'],['friends','Amigos'],['public','Público']].map(([k,l])=>(
                  <button key={k} className={editVis===k?'on':''} onClick={()=>setEditVis(k)}>{l}</button>
                ))}
              </div>
            </div>
            <div className="modal-actions">
              <button className="btn btn-secondary" onClick={()=>setEditInfo(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={saveInfo} disabled={!editTitle.trim()}>Guardar</button>
            </div>
          </div>
        </div>
      )}

      <div className="section-head" style={{marginTop:8}}><div className="left"><h2 className="h-section">Recetas</h2></div></div>
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {recipes.length === 0
          ? <div className="card" style={{textAlign:'center',padding:42,color:'var(--text-2)'}}><p style={{margin:0}}>Este menú no tiene recetas aún.</p></div>
          : recipes.map(r => {
            const cat = catPool.find(c=>c.id===(r.category||r.category_id)) || {color:'#888',name:'Sin categoría'};
            return (
              <div key={r.id} className="recipe-row" onClick={()=>go({screen:'recipe',id:r.id})}>
                <div className="rr-thumb"><Placeholder label={r.title.toLowerCase()} color={cat.color}/></div>
                <div>
                  <div className="rr-title">{r.title}</div>
                  <div className="rr-meta">
                    <span><IconClock size={11}/> {r.minutes} min</span>
                    <span>· {cat.name}</span>
                    <span>· {r.servings} porciones</span>
                  </div>
                </div>
                <IconChevR size={16} stroke="var(--text-3)"/>
              </div>
            );
          })}
      </div>

      {editing && (
        <div className="modal-backdrop" onClick={()=>setEditing(false)}>
          <div className="modal" style={{width:'min(540px,calc(100vw - 32px))',maxHeight:'85vh',display:'flex',flexDirection:'column'}}
            onClick={e=>e.stopPropagation()}>
            <h2 style={{marginBottom:4}}>Editar recetas</h2>
            <p className="modal-sub" style={{marginBottom:14}}>
              Seleccioná qué recetas incluir en <strong>{menu.title}</strong>. {pending.length} seleccionadas.
            </p>
            <input className="input" placeholder="Buscar receta..." value={search} onChange={e=>setSearch(e.target.value)}
              style={{marginBottom:12}}/>
            <div style={{overflowY:'auto',flex:1,display:'flex',flexDirection:'column',gap:4}}>
              {filtered.map(r => {
                const checked = isIn(r.id);
                const cat = catPool.find(c=>c.id===(r.category||r.category_id)) || {color:'#888',name:'Sin categoría'};
                return (
                  <label key={r.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:10,
                    cursor:'pointer',
                    background: checked ? 'color-mix(in oklab,var(--accent) 8%,transparent)' : 'var(--surface-2)',
                    border: checked ? '1.5px solid color-mix(in oklab,var(--accent) 30%,transparent)' : '1.5px solid transparent',
                    transition:'background .12s,border .12s'}}>
                    <input type="checkbox" checked={checked} onChange={()=>toggle(r.id)}
                      style={{width:16,height:16,accentColor:'var(--accent)',cursor:'pointer',flexShrink:0}}/>
                    <div style={{width:36,height:36,borderRadius:8,flexShrink:0,overflow:'hidden'}}>
                      <Placeholder label={r.title.toLowerCase()} color={cat.color}/>
                    </div>
                    <div style={{flex:1,minWidth:0}}>

                      <div style={{fontSize:12,color:'var(--text-3)',display:'flex',gap:6,marginTop:1}}>
                        <span><IconClock size={10}/> {r.minutes} min</span>
                        <span>· {cat.name}</span>
                      </div>
                    </div>
                  </label>
                );
              })}
            </div>
            <div className="modal-actions" style={{marginTop:14}}>
              <button className="btn btn-secondary" onClick={()=>setEditing(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={saveEdit}>Guardar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AllCategoriesScreen({ go, categories, authUser, onCreateCategory, onDeleteCategory, onUpdateCategory, onReorderCategories }) {
  const cats = categories || CATEGORIES;
  const COLORS = ['#ff9500','#ff2d55','#5e5ce6','#34c759','#bf5af2','#0a84ff','#ffb340','#bf8a5b'];

  // ── crear
  const [showCreate, setShowCreate] = useState(false);
  const [newName,    setNewName]    = useState('');
  const [newColor,   setNewColor]   = useState(COLORS[0]);
  const [saving,     setSaving]     = useState(false);

  // ── editar / eliminar
  const [editCat,      setEditCat]      = useState(null);
  const [editName,     setEditName]     = useState('');
  const [editColor,    setEditColor]    = useState(COLORS[0]);
  const [editCover,    setEditCover]    = useState(null);
  const [editSaving,   setEditSaving]   = useState(false);
  const [delConfirm,   setDelConfirm]   = useState(false);
  const [confirmDel,   setConfirmDel]   = useState(null);

  // ── drag-and-drop reorder
  const [dragIdx,  setDragIdx]  = useState(null);
  const [overIdx,  setOverIdx]  = useState(null);
  const didDragRef = React.useRef(false);

  const handleDragStart = (e, idx) => {
    setDragIdx(idx);
    didDragRef.current = false;
    e.dataTransfer.effectAllowed = 'move';
  };
  const handleDragOver = (e, idx) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (idx !== overIdx) setOverIdx(idx);
  };
  const handleDrop = (e, idx) => {
    e.preventDefault();
    if (dragIdx === null || dragIdx === idx) return;
    didDragRef.current = true;
    const reordered = [...cats];
    const [moved] = reordered.splice(dragIdx, 1);
    reordered.splice(idx, 0, moved);
    onReorderCategories && onReorderCategories(reordered);
    setDragIdx(null);
    setOverIdx(null);
  };
  const handleDragEnd = () => { setDragIdx(null); setOverIdx(null); };

  const openEdit = (cat) => {
    setEditCat(cat);
    setEditName(cat.name);
    setEditColor(cat.color || COLORS[0]);
    setEditCover(cat.cover_url || null);
    setDelConfirm(false);
  };

  const handleCreate = async () => {
    if (!newName.trim()) return;
    setSaving(true);
    await onCreateCategory({ name: newName.trim(), color: newColor });
    setSaving(false);
    setShowCreate(false);
    setNewName(''); setNewColor(COLORS[0]);
  };

  const handleUpdate = async () => {
    if (!editName.trim()) return;
    setEditSaving(true);
    await onUpdateCategory({ id: editCat.id, name: editName, color: editColor, cover_url: editCover });
    setEditSaving(false);
    setEditCat(null);
  };

  const handleCoverUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file || !authUser) return;
    const localUrl = URL.createObjectURL(file);
    setEditCover(localUrl);
    try {
      const ext = file.name.split('.').pop();
      const path = `${authUser.id}/${Date.now()}.${ext}`;
      const { error } = await sb.storage.from('category-covers').upload(path, file, { contentType: file.type, upsert: true });
      if (!error) {
        const { data: { publicUrl } } = sb.storage.from('category-covers').getPublicUrl(path);
        URL.revokeObjectURL(localUrl);
        setEditCover(publicUrl);
      }
    } catch(e) {}
  };

  const isVideo = (url) => url && /\.(mp4|webm|mov|m4v)(\?|$)/i.test(url);

  return (
    <div>
      <div className="hero">
        <div>
          <p className="eyebrow">Recetario</p>
          <h1 className="h-large">Categorías</h1>
          <p className="sub">{cats.reduce((s,c)=>s+(c.count||0),0)} recetas en {cats.length} categorías</p>
        </div>
        {authUser && (
          <button className="btn btn-primary btn-lg" onClick={()=>setShowCreate(true)}>
            <IconPlus size={16} strokeWidth={2.2}/> Nueva categoría
          </button>
        )}
      </div>

      <div className="cat-grid" style={{gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))'}}>
        {cats.map((cat, idx) => {
          const isOwn = cat.user_id && authUser && cat.user_id === authUser.id;
          const hasCover = !!cat.cover_url;
          const isDragging = dragIdx === idx;
          const isOver = overIdx === idx && dragIdx !== idx;
          return (
            <div key={cat.id} className="cat-card" style={{aspectRatio:'4/3',
              opacity: isDragging ? 0.4 : 1,
              outline: isOver ? '2.5px solid var(--accent)' : 'none',
              outlineOffset: -2,
              transition: 'opacity .15s, outline .1s',
              cursor: 'grab'}}
              draggable
              onDragStart={e=>handleDragStart(e,idx)}
              onDragOver={e=>handleDragOver(e,idx)}
              onDrop={e=>handleDrop(e,idx)}
              onDragEnd={handleDragEnd}
              onClick={()=>{ if(!didDragRef.current) go({screen:'category',id:cat.id}); didDragRef.current=false; }}>
              {hasCover ? (
                <>
                  <div style={{position:'absolute',inset:0,zIndex:0}}>
                    {isVideo(cat.cover_url)
                      ? <video src={cat.cover_url} style={{width:'100%',height:'100%',objectFit:'cover'}} muted autoPlay loop playsInline/>
                      : <img src={cat.cover_url} style={{width:'100%',height:'100%',objectFit:'cover'}}/>}
                    <div style={{position:'absolute',inset:0,background:'linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.6) 100%)'}}/>
                  </div>
                  <div style={{display:'flex',gap:6,alignItems:'center',position:'relative',zIndex:1}}>
                    <span style={{width:8,height:8,borderRadius:'50%',background:cat.color,display:'inline-block'}}/>
                    <span style={{fontSize:12,color:'rgba(255,255,255,.8)'}}>{cat.count||0} recetas</span>
                    {authUser && (
                      <div className="cat-actions" style={{marginLeft:'auto',display:'flex',gap:4}}>
                        <button onClick={e=>{e.stopPropagation();openEdit(cat);}} title="Editar"
                          style={{width:26,height:26,borderRadius:'50%',background:'rgba(0,0,0,.4)',
                            color:'#fff',border:'none',cursor:'pointer',display:'grid',placeItems:'center',
                            backdropFilter:'blur(4px)'}}>
                          <IconEdit size={12}/>
                        </button>
                        <button onClick={e=>{e.stopPropagation();setConfirmDel(cat);}} title="Eliminar"
                          style={{width:26,height:26,borderRadius:'50%',background:'rgba(200,0,0,.5)',
                            color:'#fff',border:'none',cursor:'pointer',display:'grid',placeItems:'center',
                            backdropFilter:'blur(4px)'}}>
                          <IconTrash size={12}/>
                        </button>
                      </div>
                    )}
                  </div>
                  <div style={{position:'relative',zIndex:1}}>
                    <div className="cat-name" style={{fontSize:20,color:'#fff'}}>{cat.name}</div>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginTop:4}}>
                      <span style={{fontSize:12,color:'rgba(255,255,255,.75)'}}>Ver todo →</span>
                    </div>
                  </div>
                </>
              ) : (
                <>
                  <div className="cat-blob" style={{background:cat.color,width:120,height:120,right:-30,bottom:-30}}/>
                  <div style={{display:'flex',gap:6,alignItems:'center',position:'relative'}}>
                    <span style={{width:8,height:8,borderRadius:'50%',background:cat.color,display:'inline-block'}}/>
                    <span className="cat-meta">{cat.count||0} recetas</span>
                    {authUser && (
                      <div className="cat-actions" style={{marginLeft:'auto',display:'flex',gap:4}}>
                        <button onClick={e=>{e.stopPropagation();openEdit(cat);}} title="Editar"
                          style={{width:26,height:26,borderRadius:'50%',background:'var(--surface-2)',
                            color:'var(--text-2)',border:'none',cursor:'pointer',display:'grid',placeItems:'center'}}>
                          <IconEdit size={12}/>
                        </button>
                        <button onClick={e=>{e.stopPropagation();setConfirmDel(cat);}} title="Eliminar"
                          style={{width:26,height:26,borderRadius:'50%',
                            background:'color-mix(in oklab,var(--danger) 14%,transparent)',
                            color:'var(--danger)',border:'none',cursor:'pointer',display:'grid',placeItems:'center'}}>
                          <IconTrash size={12}/>
                        </button>
                      </div>
                    )}
                  </div>
                  <div>
                    <div className="cat-name" style={{fontSize:20}}>{cat.name}</div>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginTop:4}}>
                      <span className="cat-meta">Ver todo →</span>
                      <span className="pill" style={{fontSize:10,height:18,padding:'0 6px'}}>Tuya</span>
                    </div>
                  </div>
                </>
              )}
            </div>
          );
        })}
      </div>

      {/* ── Modal: nueva categoría ── */}
      {showCreate && (
        <div className="modal-backdrop" onClick={()=>setShowCreate(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h2>Nueva categoría</h2>
            <p className="modal-sub">Creá tu propia categoría para organizar recetas.</p>
            <div className="field">
              <label>Nombre *</label>
              <input className="input" autoFocus placeholder="Ej. Postres, Vegano, Sin TACC..."
                value={newName} onChange={e=>setNewName(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&handleCreate()}/>
            </div>
            <div className="field">
              <label>Color</label>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {COLORS.map(c=>(
                  <button key={c} onClick={()=>setNewColor(c)}
                    style={{width:32,height:32,borderRadius:'50%',background:c,border:'none',cursor:'pointer',
                      outline:newColor===c?'2.5px solid var(--text)':'none',outlineOffset:2}}/>
                ))}
              </div>
              <div style={{height:36,borderRadius:10,marginTop:10,
                background:`repeating-linear-gradient(135deg,${newColor}33 0 12px,${newColor}66 12px 24px)`}}/>
            </div>
            <div className="modal-actions">
              <button className="btn btn-secondary" onClick={()=>setShowCreate(false)}>Cancelar</button>
              <button className="btn btn-primary" onClick={handleCreate} disabled={!newName.trim()||saving}>
                {saving ? <div className="spinner" style={{width:14,height:14,color:'#fff',borderWidth:2}}/> : 'Crear'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Modal: confirmar eliminación directa ── */}
      {confirmDel && (
        <div className="modal-backdrop" onClick={()=>setConfirmDel(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{width:'min(380px,calc(100vw - 32px))'}}>
            <h2>Eliminar categoría</h2>
            <p className="modal-sub">
              ¿Eliminás <strong>{confirmDel.name}</strong>? Las recetas de esta categoría quedarán sin categorizar.
            </p>
            <div className="modal-actions">
              <button className="btn btn-secondary" onClick={()=>setConfirmDel(null)}>Cancelar</button>
              <button className="btn btn-primary" style={{background:'var(--danger)'}}
                onClick={()=>{ onDeleteCategory(confirmDel.id); setConfirmDel(null); }}>
                Eliminar
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Modal: editar categoría ── */}
      {editCat && (
        <div className="modal-backdrop" onClick={()=>setEditCat(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h2>Editar categoría</h2>
            <p className="modal-sub">{editCat.name}</p>

            {/* Portada */}
            <div className="field">
              <label>Portada <span style={{color:'var(--text-3)',fontWeight:400,fontSize:12}}>(foto o video · opcional)</span></label>
              <input type="file" accept="image/*,video/*" id="cat-cover-upload" style={{display:'none'}} onChange={handleCoverUpload}/>
              {editCover ? (
                <div style={{position:'relative',borderRadius:12,overflow:'hidden',height:130}}>
                  {isVideo(editCover)
                    ? <video src={editCover} style={{width:'100%',height:'100%',objectFit:'cover'}} muted autoPlay loop playsInline/>
                    : <img src={editCover} style={{width:'100%',height:'100%',objectFit:'cover'}}/>}
                  <button type="button" onClick={()=>setEditCover(null)}
                    style={{position:'absolute',top:8,right:8,background:'rgba(0,0,0,.55)',border:'none',
                      borderRadius:6,color:'#fff',padding:'4px 10px',cursor:'pointer',fontSize:12,backdropFilter:'blur(4px)'}}>
                    Quitar
                  </button>
                  <label htmlFor="cat-cover-upload"
                    style={{position:'absolute',top:8,left:8,background:'rgba(0,0,0,.55)',border:'none',
                      borderRadius:6,color:'#fff',padding:'4px 10px',cursor:'pointer',fontSize:12,backdropFilter:'blur(4px)'}}>
                    Cambiar
                  </label>
                </div>
              ) : (
                <label htmlFor="cat-cover-upload"
                  style={{display:'flex',alignItems:'center',gap:10,padding:'12px 16px',borderRadius:10,
                    border:'1.5px dashed var(--border)',cursor:'pointer',color:'var(--text-2)',fontSize:14,
                    transition:'border-color .15s'}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
                  onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                  </svg>
                  Subir foto o video desde tu dispositivo
                </label>
              )}
            </div>

            {/* Nombre */}
            <div className="field">
              <label>Nombre *</label>
              <input className="input" value={editName} onChange={e=>setEditName(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&handleUpdate()}/>
            </div>

            {/* Color */}
            <div className="field">
              <label>Color</label>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {COLORS.map(c=>(
                  <button key={c} onClick={()=>setEditColor(c)}
                    style={{width:32,height:32,borderRadius:'50%',background:c,border:'none',cursor:'pointer',
                      outline:editColor===c?'2.5px solid var(--text)':'none',outlineOffset:2}}/>
                ))}
              </div>
              <div style={{height:36,borderRadius:10,marginTop:10,
                background:`repeating-linear-gradient(135deg,${editColor}33 0 12px,${editColor}66 12px 24px)`}}/>
            </div>

            <div className="modal-actions">
              {delConfirm ? (
                <>
                  <span style={{fontSize:13,color:'var(--danger)',flex:1,fontWeight:500}}>¿Confirmar eliminación?</span>
                  <button className="btn btn-secondary" onClick={()=>setDelConfirm(false)}>No</button>
                  <button className="btn btn-primary" style={{background:'var(--danger)'}}
                    onClick={()=>{ onDeleteCategory(editCat.id); setEditCat(null); }}>
                    Sí, eliminar
                  </button>
                </>
              ) : (
                <>
                  <button className="btn btn-secondary" style={{color:'var(--danger)',marginRight:'auto'}}
                    onClick={()=>setDelConfirm(true)}>
                    Eliminar
                  </button>
                  <button className="btn btn-secondary" onClick={()=>setEditCat(null)}>Cancelar</button>
                  <button className="btn btn-primary" onClick={handleUpdate} disabled={!editName.trim()||editSaving}>
                    {editSaving
                      ? <div className="spinner" style={{width:14,height:14,color:'#fff',borderWidth:2}}/>
                      : 'Guardar'}
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
