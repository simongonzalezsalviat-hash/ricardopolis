function Topbar({ route, go, dark, onToggleDark, categories, authUser, notifs, onClearNotifs, recipes }) {
  const cats = categories || CATEGORIES;
  const recs = recipes || RECIPES;
  const [showNotifs, setShowNotifs] = useState(false);
  const [searchQ, setSearchQ]       = useState('');
  const [searchOpen, setSearchOpen] = useState(false);

  const searchResults = useMemo(() => {
    const q = searchQ.trim().toLowerCase();
    if (q.length < 2) return [];
    return recs.filter(r =>
      r.title.toLowerCase().includes(q) || (r.description||'').toLowerCase().includes(q)
    ).slice(0, 8);
  }, [searchQ, recs]);

  const crumbs = useMemo(() => {
    if (route.screen==='home') return [{label:'Inicio',here:true}];
    if (route.screen==='categorias') return [{label:'Categorías',here:true}];
    if (route.screen==='create-recipe') return [{label:'Nueva receta',here:true}];
    if (route.screen==='category') {
      const cat = cats.find(x=>x.id===route.id);
      return [{label:'Categorías',go:()=>go({screen:'categorias'})},{label:cat?.name||route.id,here:true}];
    }
    if (route.screen==='mis-menus') return [{label:'Mis menús',here:true}];
    if (route.screen==='menu') return [{label:'Mis menús',go:()=>go({screen:'mis-menus'})},{label:route.title||'',here:true}];
    if (route.screen==='amigos') return [{label:'Amigos',here:true}];
    if (route.screen==='mensajes') return [{label:'Mensajes',here:true}];
    if (route.screen==='perfil') return [{label:'Mi perfil',here:true}];
    if (route.screen==='user-profile') return [{label:route.name||'Perfil',here:true}];
    if (route.screen==='recipe') {
      const r = RECIPES.find(x=>x.id===route.id);
      const cat = CATEGORIES.find(x=>x.id===r?.category);
      return [{label:'Categorías',go:()=>go({screen:'categorias'})},{label:cat?.name||'',go:()=>go({screen:'category',id:cat?.id})},{label:r?.title||'',here:true}];
    }
    return [];
  }, [route]);

  return (
    <header className="topbar">
      <button className="icon-btn" onClick={()=>go(null)} title="Atrás" style={{visibility:crumbs.length>1?'visible':'hidden'}}>
        <IconChevL size={16}/>
      </button>
      <div className="crumbs">
        {crumbs.map((c,i) => (
          <React.Fragment key={i}>
            {c.here ? <span className="here">{c.label}</span> : <button onClick={c.go}>{c.label}</button>}
            {i<crumbs.length-1 && <span className="sep">/</span>}
          </React.Fragment>
        ))}
      </div>
      <div className="topbar-right">
        <div className="search" style={{position:'relative'}}>
          <IconSearch size={14}/>
          <input placeholder="Buscar recetas..." value={searchQ}
            onChange={e=>{setSearchQ(e.target.value);setSearchOpen(true)}}
            onFocus={()=>setSearchOpen(true)}
            onBlur={()=>setTimeout(()=>setSearchOpen(false),150)}/>
          <span style={{fontSize:10,padding:'1px 5px',border:'1px solid var(--border)',borderRadius:4,color:'var(--text-3)'}}>⌘ K</span>
          {searchOpen && searchResults.length > 0 && (
            <div style={{position:'absolute',top:'calc(100% + 8px)',left:0,width:'100%',minWidth:280,
              background:'var(--elevated)',border:'1px solid var(--border)',borderRadius:12,
              boxShadow:'var(--shadow-lg)',zIndex:200,overflow:'hidden'}}>
              {searchResults.map(r => (
                <button key={r.id} onMouseDown={()=>{go({screen:'recipe',id:r.id});setSearchQ('');setSearchOpen(false);}}
                  style={{width:'100%',display:'flex',gap:10,padding:'10px 14px',background:'none',border:'none',
                          cursor:'pointer',textAlign:'left',borderBottom:'1px solid var(--border)'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13.5,fontWeight:600,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.title}</div>
                    <div style={{fontSize:11.5,color:'var(--text-3)'}}>{r.minutes} min · {r.difficulty||''}</div>
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{position:'relative'}}>
          {showNotifs && (
            <div style={{position:'fixed',inset:0,zIndex:50}} onClick={()=>setShowNotifs(false)}/>
          )}
          <button className="icon-btn" title="Notificaciones" onClick={()=>setShowNotifs(s=>!s)} style={{position:'relative'}}>
            <IconBell size={16}/>
            {notifs && notifs.length > 0 && (
              <span style={{position:'absolute',top:4,right:4,width:7,height:7,borderRadius:'50%',
                background:'var(--danger)',border:'1.5px solid var(--bg)'}}/>
            )}
          </button>
          {showNotifs && (
            <div style={{position:'absolute',right:0,top:'calc(100% + 8px)',width:300,
              background:'var(--elevated)',border:'1px solid var(--border)',borderRadius:14,
              boxShadow:'var(--shadow-lg)',zIndex:100,overflow:'hidden'}}>
              <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{fontWeight:600,fontSize:14}}>Notificaciones</span>
                {notifs && notifs.length > 0 && onClearNotifs && (
                  <button style={{fontSize:12,color:'var(--accent)',background:'none',border:'none',cursor:'pointer',padding:0}}
                    onClick={()=>{onClearNotifs();setShowNotifs(false);}}>Limpiar</button>
                )}
              </div>
              {(!notifs || notifs.length === 0) ? (
                <div style={{padding:'20px 16px',textAlign:'center',color:'var(--text-3)',fontSize:13}}>
                  Sin notificaciones nuevas
                </div>
              ) : (
                <div style={{maxHeight:320,overflowY:'auto'}}>
                  {notifs.map((n,i)=>(
                    <div key={i} style={{padding:'10px 16px',borderBottom:'1px solid var(--border)',fontSize:13}}>
                      <div style={{color:'var(--text)',lineHeight:1.4}}>{n.text}</div>
                      <div style={{color:'var(--text-3)',fontSize:11,marginTop:3}}>
                        {n.time ? new Date(n.time).toLocaleDateString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : ''}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
        <button className="icon-btn" title={dark?'Modo claro':'Modo oscuro'} onClick={onToggleDark}>
          {dark ? <IconSun size={16}/> : <IconMoon size={16}/>}
        </button>
      </div>
    </header>
  );
}

function CreateMenuModal({ onClose, onCreate, allRecipes }) {
  const recipePool = allRecipes?.length ? allRecipes : RECIPES;
  const [title, setTitle] = useState('');
  const [desc, setDesc] = useState('');
  const [picks, setPicks] = useState([]);
  const [vis, setVis] = useState('friends');
  const [color, setColor] = useState('#ff9500');
  const [coverUrl, setCoverUrl] = useState(null);
  const [recipeSearch, setRecipeSearch] = useState('');
  const createUploadIdRef = React.useRef(0);
  const togglePick = (id) => setPicks(p => p.includes(id) ? p.filter(x=>x!==id) : [...p,id]);
  const clearCoverUrl = () => { setCoverUrl(null); createUploadIdRef.current++; };
  const handleCoverUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const uid = ++createUploadIdRef.current;
    const localUrl = URL.createObjectURL(file);
    setCoverUrl(localUrl);
    const menuId = 'm-' + Date.now();
    const path = `menu-${menuId}-${Date.now()}.${file.name.split('.').pop()}`;
    const { error } = await sb.storage.from('menu-covers').upload(path, file, { contentType: file.type, upsert: true });
    if (!error && createUploadIdRef.current === uid) {
      const { data: { publicUrl } } = sb.storage.from('menu-covers').getPublicUrl(path);
      URL.revokeObjectURL(localUrl);
      setCoverUrl(publicUrl);
    }
  };
  const submit = () => {
    if (!title.trim()) return;
    onCreate({ title: title.trim(), description: desc.trim()||null, recipes: picks, visibility: vis, cover: color, cover_url: coverUrl||null });
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>Nuevo menú</h2>
        <p className="modal-sub">Combiná recetas y compartí tu colección con amigos.</p>
        <div className="field">
          <label>Nombre</label>
          <input className="input" placeholder="Ej. Cena de domingo" value={title} onChange={e=>setTitle(e.target.value)} autoFocus/>
        </div>
        <div className="field">
          <label>Descripción <span style={{color:'var(--text-3)',fontWeight:400}}>(opcional)</span></label>
          <textarea className="textarea" placeholder="Una breve descripción..." value={desc} onChange={e=>setDesc(e.target.value)}/>
        </div>
        <div className="field">
          <label>Color de portada</label>
          <div style={{display:'flex',gap:8}}>
            {['#ff9500','#ff2d55','#5e5ce6','#34c759','#bf5af2','#0a84ff','#ff9f0a'].map(c=>(
              <button key={c} onClick={()=>setColor(c)} style={{width:30,height:30,borderRadius:'50%',background:c,outline:color===c?'2.5px solid var(--text)':'none',outlineOffset:2}}/>
            ))}
          </div>
        </div>
        <div className="field">
          <label>Foto de portada <span style={{color:'var(--text-3)',fontWeight:400,fontSize:12}}>(opcional)</span></label>
          <input type="file" accept="image/*" id="create-menu-cover-upload" style={{display:'none'}} onChange={handleCoverUpload}/>
          {coverUrl ? (
            <div style={{position:'relative',aspectRatio:'16/9',borderRadius:12,overflow:'hidden',marginTop:6}}>
              <img src={coverUrl} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              <button type="button" onClick={clearCoverUrl}
                style={{position:'absolute',top:8,right:8,width:26,height:26,borderRadius:'50%',
                  background:'rgba(0,0,0,.5)',border:'none',cursor:'pointer',color:'#fff',fontSize:14,
                  display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
            </div>
          ) : (
            <label htmlFor="create-menu-cover-upload"
              style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,
                border:'1.5px dashed var(--border)',cursor:'pointer',marginTop:6,color:'var(--text-2)',fontSize:13}}>
              <IconPlus size={16}/> Subir foto
            </label>
          )}
        </div>
        <div className="field">
          <label>Recetas <span style={{color:'var(--text-3)',fontWeight:400}}>· {picks.length} seleccionadas</span></label>
          <input className="input" placeholder="Buscar receta..." value={recipeSearch} onChange={e=>setRecipeSearch(e.target.value)} style={{marginBottom:8}}/>
          <div className="chips" style={{maxHeight:180,overflowY:'auto'}}>
            {recipePool.filter(r=>!recipeSearch.trim()||r.title.toLowerCase().includes(recipeSearch.toLowerCase())).map(r=>(
              <button key={r.id} className={"chip "+(picks.includes(r.id)?'on':'')} onClick={()=>togglePick(r.id)}>{r.title}</button>
            ))}
          </div>
        </div>
        <div className="field">
          <label>Visibilidad</label>
          <div className="visibility-row">
            {[['private','Privado'],['friends','Amigos'],['public','Público']].map(([k,l])=>(
              <button key={k} className={vis===k?'on':''} onClick={()=>setVis(k)}>{l}</button>
            ))}
          </div>
        </div>
        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={submit} disabled={!title.trim()}>Crear menú</button>
        </div>
      </div>
    </div>
  );
}

function ShareModal({ recipeId, onClose }) {
  const recipe = RECIPES.find(r => r.id===recipeId);
  const [copied, setCopied] = useState(false);
  const link = `menu.app/r/${recipeId}`;
  const friends = [
    {name:'Lucía Méndez',i:'LM',c:'#ff2d55'},
    {name:'Mateo Ruiz',i:'MR',c:'#5e5ce6'},
    {name:'Carla Vega',i:'CV',c:'#ff9500'},
    {name:'Tomás Rey',i:'TR',c:'#0a84ff'},
  ];
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{width:'min(440px,calc(100vw - 32px))'}}>
        <h2>Compartir</h2>
        <p className="modal-sub">{recipe?.title}</p>
        <div className="field">
          <label>Enlace</label>
          <div style={{display:'flex',gap:8}}>
            <input className="input" value={link} readOnly style={{flex:1}}/>
            <button className="btn btn-secondary" onClick={()=>{
              navigator.clipboard?.writeText(link).catch(()=>{});
              setCopied(true); setTimeout(()=>setCopied(false),1500);
            }}>{copied?'¡Copiado!':'Copiar'}</button>
          </div>
        </div>
        <div className="field">
          <label>Enviar a</label>
          <div style={{display:'flex',flexDirection:'column',gap:2}}>
            {friends.map(f=>(
              <div key={f.name} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 6px',borderRadius:10,cursor:'pointer'}}
                   onMouseEnter={e=>e.currentTarget.style.background='var(--surface)'}
                   onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <div className="avatar" style={{background:f.c,width:34,height:34,fontSize:13}}>{f.i}</div>
                <div style={{flex:1,fontSize:14,fontWeight:500}}>{f.name}</div>
                <button className="btn btn-secondary" style={{height:28,padding:'0 14px',fontSize:12.5}}>Enviar</button>
              </div>
            ))}
          </div>
        </div>
        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onClose}>Cerrar</button>
        </div>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) return (
      <div style={{padding:40,textAlign:'center',color:'var(--text)'}}>
        <h2 style={{marginBottom:12}}>Algo salió mal</h2>
        <p style={{color:'var(--text-2)',marginBottom:20}}>{this.state.error.message}</p>
        <button className="btn btn-primary" onClick={()=>this.setState({error:null})}>Reintentar</button>
      </div>
    );
    return this.props.children;
  }
}

function App() {
  const [dark, setDark] = useState(() => {
    try { return localStorage.getItem('menu-theme') === 'dark'; } catch { return false; }
  });
  const [authUser, setAuthUser]     = useState(null);
  const [profile, setProfile]       = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [dbCategories, setDbCategories] = useState(null);
  const [dbRecipes, setDbRecipes]   = useState(null);
  const [route, setRoute]           = useState({screen:'home'});
  const [navHistory, setNavHistory] = useState([]);
  const [likes, setLikes]           = useState({});
  const [creating, setCreating]     = useState(false);
  const [sharing, setSharing]       = useState(null);
  const [userMenus, setUserMenus]         = useState(MENUS_INIT);
  const [userCategories, setUserCategories] = useState([]);
  const [hiddenCats,     setHiddenCats]     = useState([]);
  const [catOverrides,   setCatOverrides]   = useState({});
  const [catOrder,       setCatOrder]       = useState([]);
  const [catRecs,        setCatRecs]        = useState({});
  const [savedCats,      setSavedCats]      = useState({}); // { recipeId: categoryId }
  const [toast, setToast]           = useState(null);
  const [notifs, setNotifs]         = useState([]);
  const toastTimer = React.useRef(null);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    try { localStorage.setItem('menu-theme', dark ? 'dark' : 'light'); } catch {}
  }, [dark]);

  const ucKey  = (uid) => `menu-ucats-${uid}`;
  const hcKey  = (uid) => `menu-hcats-${uid}`;
  const coKey  = (uid) => `menu-cOver-${uid}`;
  const orKey  = (uid) => `menu-catOrd-${uid}`;
  const crKey  = (uid) => `menu-catRecs-${uid}`;
  const umKey  = (uid) => `menu-umenus-${uid}`;
  const scKey  = (uid) => `menu-savedcats-${uid}`;

  const loadUserCategories = (userId) => {
    try { const r = localStorage.getItem(ucKey(userId)); if (r) setUserCategories(JSON.parse(r)); } catch(e) {}
    try { const r = localStorage.getItem(hcKey(userId)); if (r) setHiddenCats(JSON.parse(r)); } catch(e) {}
    try { const r = localStorage.getItem(coKey(userId)); if (r) setCatOverrides(JSON.parse(r)); } catch(e) {}
    try { const r = localStorage.getItem(orKey(userId)); if (r) setCatOrder(JSON.parse(r)); } catch(e) {}
    try { const r = localStorage.getItem(crKey(userId)); if (r) setCatRecs(JSON.parse(r)); } catch(e) {}
    try { const r = localStorage.getItem(scKey(userId)); if (r) setSavedCats(JSON.parse(r)); } catch(e) {}
  };

  const handleSaveToCategory = async (recipeId, categoryId) => {
    // 1. registrar asociación receta→categoría
    const updatedSaved = { ...savedCats, [recipeId]: categoryId };
    setSavedCats(updatedSaved);
    try { localStorage.setItem(scKey(authUser.id), JSON.stringify(updatedSaved)); } catch(e) {}

    // 2. agregar como "extra" en catRecs para que aparezca en CategoryScreen
    const cr = catRecs[categoryId] || {};
    const prevExtra = cr.extra || [];
    if (!prevExtra.includes(recipeId)) {
      const updatedCatRecs = { ...catRecs, [categoryId]: { extra: [...prevExtra, recipeId], hidden: cr.hidden || [] } };
      setCatRecs(updatedCatRecs);
      try { localStorage.setItem(crKey(authUser.id), JSON.stringify(updatedCatRecs)); } catch(e) {}
    }

    try { await sb.from('saves').upsert({ recipe_id: recipeId, user_id: authUser.id }, { onConflict: 'recipe_id,user_id' }); } catch(e) {}
    showToast('¡Receta guardada!');
  };

  const handleUnsaveRecipe = async (recipeId) => {
    // 1. quitar asociación
    const prevCatId = savedCats[recipeId];
    const updatedSaved = { ...savedCats };
    delete updatedSaved[recipeId];
    setSavedCats(updatedSaved);
    try { localStorage.setItem(scKey(authUser.id), JSON.stringify(updatedSaved)); } catch(e) {}

    // 2. quitar de catRecs si estaba como "extra"
    if (prevCatId) {
      const cr = catRecs[prevCatId] || {};
      const updatedCatRecs = { ...catRecs, [prevCatId]: { extra: (cr.extra||[]).filter(id => id !== recipeId), hidden: cr.hidden || [] } };
      setCatRecs(updatedCatRecs);
      try { localStorage.setItem(crKey(authUser.id), JSON.stringify(updatedCatRecs)); } catch(e) {}
    }

    try { await sb.from('saves').delete().eq('recipe_id', recipeId).eq('user_id', authUser.id); } catch(e) {}
    showToast('Receta eliminada de guardados');
  };

  const handleReorderCategories = (sorted) => {
    const order = sorted.map(c => c.id);
    setCatOrder(order);
    try { localStorage.setItem(orKey(authUser.id), JSON.stringify(order)); } catch(e) {}
  };

  const persistUserCategories = (list) => {
    if (!authUser) return;
    try { localStorage.setItem(ucKey(authUser.id), JSON.stringify(list)); } catch(e) {}
  };

  const handleCreateCategory = ({ name, color }) => {
    if (!authUser) return;
    const cat = { id: 'uc-' + Date.now(), user_id: authUser.id, name: name.trim(), color, cover_url: null, count: 0 };
    const updated = [cat, ...userCategories];
    setUserCategories(updated);
    persistUserCategories(updated);
    showToast('Categoría creada');
  };

  const handleDeleteCategory = (catId) => {
    if (userCategories.some(c => c.id === catId)) {
      const updated = userCategories.filter(c => c.id !== catId);
      setUserCategories(updated);
      persistUserCategories(updated);
    } else {
      const updated = [...hiddenCats, catId];
      setHiddenCats(updated);
      try { localStorage.setItem(hcKey(authUser.id), JSON.stringify(updated)); } catch(e) {}
    }
    showToast('Categoría eliminada');
  };

  const handleUpdateCategory = ({ id, name, color, cover_url }) => {
    if (userCategories.some(c => c.id === id)) {
      const updated = userCategories.map(c =>
        c.id === id ? {...c, name: name.trim(), color, cover_url: cover_url || null} : c
      );
      setUserCategories(updated);
      persistUserCategories(updated);
    } else {
      const updated = {...catOverrides, [id]: { name: name.trim(), color, cover_url: cover_url || null }};
      setCatOverrides(updated);
      try { localStorage.setItem(coKey(authUser.id), JSON.stringify(updated)); } catch(e) {}
    }
    showToast('Categoría actualizada');
  };

  const handleUpdateCatRecs = (catId, {extra, hidden}) => {
    const updated = {...catRecs, [catId]: {extra: extra||[], hidden: hidden||[]}};
    setCatRecs(updated);
    try { localStorage.setItem(crKey(authUser.id), JSON.stringify(updated)); } catch(e) {}
    showToast('Recetas actualizadas');
  };

  const loadUserMenus = async (userId) => {
    try {
      const { data: menus } = await sb.from('menus').select('*').eq('user_id', userId).order('created_at', { ascending: false });
      if (!menus?.length) { setUserMenus([]); return; }
      const { data: mrs } = await sb.from('menu_recipes').select('menu_id,recipe_id,position').in('menu_id', menus.map(m=>m.id)).order('position');
      const byMenu = {};
      (mrs||[]).forEach(mr => { if (!byMenu[mr.menu_id]) byMenu[mr.menu_id]=[]; byMenu[mr.menu_id].push(mr.recipe_id); });
      setUserMenus(menus.map(m => ({ ...m, author:'Tú', recipes: byMenu[m.id]||[], likes:0, saves:0, cover: m.cover||'#ff9500' })));
    } catch(e) { console.warn('loadUserMenus failed', e); }
  };

  const loadNotifs = async (user) => {
    if (!user) return;
    try {
      const { data: myRecipes } = await sb.from('recipes').select('id,title').eq('author_id', user.id);
      if (!myRecipes?.length) return;
      const ids = myRecipes.map(r=>r.id);
      const { data: cms } = await sb.from('comments').select('body,created_at,recipe_id').in('recipe_id', ids).order('created_at',{ascending:false}).limit(10);
      const recipeMap = Object.fromEntries(myRecipes.map(r=>[r.id,r.title]));
      const notifItems = (cms||[]).map(c=>({
        type:'comment', text:`Nuevo comentario en "${recipeMap[c.recipe_id]}"`, time: c.created_at
      }));
      setNotifs(notifItems);
    } catch(e) {}
  };

  // ── Sesión ────────────────────────────────────────────────────────
  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) { setAuthUser(session.user); loadProfile(session.user.id); loadNotifs(session.user); loadUserCategories(session.user.id); loadUserMenus(session.user.id); }
      setAuthLoading(false);
    });
    const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
      if (session?.user) { setAuthUser(session.user); loadProfile(session.user.id); loadNotifs(session.user); loadUserCategories(session.user.id); loadUserMenus(session.user.id); }
      else if (event === 'SIGNED_OUT') { setAuthUser(null); setProfile(null); setUserCategories([]); setHiddenCats([]); setCatOverrides({}); setCatRecs({}); setUserMenus(MENUS_INIT); }
      setAuthLoading(false);
    });
    loadData();
    return () => subscription.unsubscribe();
  }, []);

  const loadProfile = async (userId) => {
    try {
      const { data } = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
      if (data) setProfile(data);
    } catch(e) {}
  };

  const loadData = async () => {
    try {
      const [catsRes, recsRes] = await Promise.all([
        sb.from('categories').select('*').order('position'),
        sb.from('recipes').select('id,title,cover_url,cover_color,minutes,visibility,category_id,author_id,servings,difficulty,description')
          .eq('visibility','public').order('created_at',{ascending:false}).limit(60),
      ]);
      if (recsRes.data?.length)  setDbRecipes(recsRes.data.map(r=>normalizeDbRecipe(r, null)));
      if (catsRes.data?.length) {
        const recCountByCat = (recsRes.data||[]).reduce((acc,r)=>{ if(r.category_id) acc[r.category_id]=(acc[r.category_id]||0)+1; return acc; }, {});
        setDbCategories(catsRes.data.map(c=>({...c, count: recCountByCat[c.id]||0})));
      }
    } catch(e) { console.warn('DB load failed, using mock data'); }
  };

  const showToast = (msg, ms=2200) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToast(null), ms);
  };

  const handleLogin = (p) => {
    if (p?.display_name) showToast(`¡Bienvenido, ${p.display_name.split(' ')[0]}! 👋`);
  };

  const handleSignOut = async () => {
    try { await sb.auth.signOut(); } catch(e) {}
    setAuthUser(null); setProfile(null);
    setRoute({screen:'home'}); setNavHistory([]);
  };

  const displayRecipes    = dbRecipes || RECIPES;
  const displayCategories = [...(dbCategories || CATEGORIES), ...userCategories]
    .filter(cat => !hiddenCats.includes(cat.id))
    .map(cat => {
      const ov = catOverrides[cat.id];
      return {
        ...(ov ? {...cat, ...ov} : cat),
        count: (() => {
          const cr     = catRecs[cat.id] || {};
          const base   = displayRecipes.filter(r => (r.category||r.category_id) === cat.id && !(cr.hidden||[]).includes(r.id));
          const baseIds = base.map(r => r.id);
          const extras = (cr.extra||[]).filter(id => !baseIds.includes(id));
          return base.length + extras.length;
        })(),
      };
    })
    .sort((a, b) => {
      const ai = catOrder.indexOf(a.id);
      const bi = catOrder.indexOf(b.id);
      if (ai === -1 && bi === -1) return 0;
      if (ai === -1) return 1;
      if (bi === -1) return -1;
      return ai - bi;
    });

  const updateProfile = (updated) => setProfile(updated);

  const userDisplay = profile ? {
    name:      profile.display_name,
    initials:  profile.display_name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(),
    email:     authUser?.email || '',
    color:     '#007aff',
    avatarUrl: profile.avatar_url || null,
  } : null;

  if (authLoading) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)'}}>
      <div style={{textAlign:'center'}}>
        <div className="brand-mark" style={{width:48,height:48,fontSize:22,margin:'0 auto 16px',borderRadius:14}}>M</div>
        <div className="spinner" style={{margin:'0 auto',borderTopColor:'var(--accent)'}}/>
      </div>
    </div>
  );

  if (!authUser) {
    return (
      <>
        <LoginScreen onLogin={handleLogin} dark={dark} onToggleDark={()=>setDark(d=>!d)}/>
        {toast && <div className="toast">{toast}</div>}
      </>
    );
  }

  const go = (newRoute) => {
    if (newRoute === null) {
      // back
      setNavHistory(h => {
        if (h.length===0) return h;
        const prev = h[h.length-1];
        setRoute(prev);
        return h.slice(0,-1);
      });
      window.scrollTo({top:0});
      return;
    }
    setNavHistory(h => [...h, route]);
    setRoute(newRoute);
    window.scrollTo({top:0});
  };

  const toggleLike = (key) => setLikes(l => ({...l,[key]:!l[key]}));
  const openCreate = () => go({screen:'create-recipe'});
  const openCreateMenu = () => setCreating(true);
  const onCreate = async (menu) => {
    try {
      const { data: newMenu, error } = await sb.from('menus').insert({
        user_id: authUser.id,
        title: menu.title,
        description: menu.description || null,
        cover: menu.cover || '#ff9500',
        cover_url: menu.cover_url || null,
        visibility: menu.visibility || 'friends',
      }).select().maybeSingle();
      if (error || !newMenu) throw error || new Error('no data');
      if (menu.recipes?.length) {
        await sb.from('menu_recipes').insert(menu.recipes.map((rid,i) => ({ menu_id: newMenu.id, recipe_id: rid, position: i })));
      }
      setUserMenus(prev => [{ ...newMenu, author:'Tú', recipes: menu.recipes||[], likes:0, saves:0, cover: newMenu.cover||'#ff9500' }, ...prev]);
      setCreating(false);
      showToast('Menú creado');
      setTimeout(()=>go({screen:'mis-menus'}),80);
    } catch(e) { showToast('Error al crear el menú'); }
  };

  const handleUpdateMenuRecipes = async (menuId, recipeIds) => {
    try {
      await sb.from('menu_recipes').delete().eq('menu_id', menuId);
      if (recipeIds.length) {
        await sb.from('menu_recipes').insert(recipeIds.map((rid,i) => ({ menu_id: menuId, recipe_id: rid, position: i })));
      }
      setUserMenus(prev => prev.map(m => m.id === menuId ? {...m, recipes: recipeIds} : m));
      showToast('Menú actualizado');
    } catch(e) { showToast('Error al actualizar'); }
  };

  const handleAddRecipeToMenu = async (menuId, recipeId) => {
    const menu = userMenus.find(m => m.id === menuId);
    if (!menu || menu.recipes.includes(recipeId)) return;
    try {
      await sb.from('menu_recipes').insert({ menu_id: menuId, recipe_id: recipeId, position: menu.recipes.length });
      setUserMenus(prev => prev.map(m => m.id === menuId ? {...m, recipes: [...m.recipes, recipeId]} : m));
    } catch(e) {}
  };

  const handleUpdateMenu = async (menuId, {title, cover, cover_url, visibility}) => {
    try {
      const updates = { title: title.trim(), cover: cover||null, updated_at: new Date().toISOString(), ...(visibility && {visibility}) };
      if (cover_url !== undefined) updates.cover_url = cover_url;
      await sb.from('menus').update(updates).eq('id', menuId);
      setUserMenus(prev => prev.map(m => m.id === menuId
        ? {...m, title: title.trim(), cover, cover_url: cover_url !== undefined ? cover_url : m.cover_url, ...(visibility && {visibility})}
        : m));
      showToast('Menú actualizado');
    } catch(e) { showToast('Error al actualizar'); }
  };

  const handleDeleteMenu = async (menuId) => {
    try {
      await sb.from('menus').delete().eq('id', menuId);
      setUserMenus(prev => prev.filter(m => m.id !== menuId));
      showToast('Menú eliminado');
    } catch(e) { showToast('Error al eliminar'); }
  };

  let body;
  switch(route.screen) {
    case 'home':          body = <HomeScreen go={go} likes={likes} toggleLike={toggleLike} openCreate={openCreate} openCreateMenu={openCreateMenu} categories={displayCategories} recipes={displayRecipes} profile={profile}/>; break;
    case 'perfil':        body = <ProfileScreen authUser={authUser} profile={profile} onProfileUpdate={updateProfile} showToast={showToast}/>; break;
    case 'categorias':    body = <AllCategoriesScreen go={go} categories={displayCategories} authUser={authUser} onCreateCategory={handleCreateCategory} onDeleteCategory={handleDeleteCategory} onUpdateCategory={handleUpdateCategory} onReorderCategories={handleReorderCategories}/>; break;
    case 'category':      body = <CategoryScreen categoryId={route.id} go={go} categories={displayCategories} recipes={displayRecipes} catRecs={catRecs} onUpdateCatRecs={handleUpdateCatRecs} authUser={authUser}/>; break;
    case 'mis-menus':     body = <MyMenusScreen go={go} openCreate={openCreate} openCreateMenu={openCreateMenu} menus={userMenus} onDeleteMenu={handleDeleteMenu} onUpdateMenu={handleUpdateMenu}/>; break;
    case 'menu':          body = <MenuDetailScreen menuId={route.id} go={go} userMenus={userMenus} allRecipes={displayRecipes} categories={displayCategories} onUpdateRecipes={handleUpdateMenuRecipes} onUpdateMenu={handleUpdateMenu}/>; break;
    case 'amigos':        body = <FriendsScreen go={go} likes={likes} toggleLike={toggleLike} categories={displayCategories} savedCats={savedCats} onSaveToCategory={handleSaveToCategory} onUnsave={handleUnsaveRecipe}/>; break;
    case 'recipe':        body = <RecipeScreen recipeId={route.id} go={go} authUser={authUser} profile={profile} allRecipes={displayRecipes} categories={displayCategories} savedCats={savedCats} onSaveToCategory={handleSaveToCategory} onUnsave={handleUnsaveRecipe} onShare={()=>setSharing(route.id)} showToast={showToast}/>; break;
    case 'create-recipe': body = <CreateRecipeScreen go={go} authUser={authUser} profile={profile} categories={displayCategories} showToast={showToast} initialCategoryId={route.addToCategory} onCreated={(id)=>{
      loadData();
      if (route.addToMenu)     { handleAddRecipeToMenu(route.addToMenu, id); go({screen:'menu',id:route.addToMenu}); }
      else if (route.addToCategory) go({screen:'category',id:route.addToCategory});
      else go({screen:'recipe',id});
    }}/>; break;
    case 'mensajes':      body = <MessagesScreen authUser={authUser} profile={profile} go={go} showToast={showToast}/>; break;
    case 'user-profile':  body = <UserProfileScreen userId={route.id} go={go} authUser={authUser}/>; break;
    default:              body = <HomeScreen go={go} likes={likes} toggleLike={toggleLike} openCreate={openCreate} openCreateMenu={openCreateMenu} categories={displayCategories} recipes={displayRecipes} profile={profile}/>;
  }

  return (
    <div className="app">
      <Sidebar route={route} go={go} openCreate={openCreate} user={userDisplay} onSignOut={handleSignOut} onProfile={()=>go({screen:'perfil'})} categories={displayCategories} onCreateCategory={authUser ? handleCreateCategory : null}/>
      <div className="main">
        <Topbar route={route} go={go} dark={dark} onToggleDark={()=>setDark(d=>!d)} categories={displayCategories} authUser={authUser} notifs={notifs} onClearNotifs={()=>setNotifs([])} recipes={displayRecipes}/>
        <div className="content">{body}</div>
      </div>
      {creating && <CreateMenuModal onClose={()=>setCreating(false)} onCreate={onCreate} allRecipes={displayRecipes}/>}
      {sharing && <ShareModal recipeId={sharing} onClose={()=>setSharing(null)}/>}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>

<script>
// SW inline — solo se registra en HTTPS (GitHub Pages cumple)
(async () => {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  try {
    const swCode = `
      const CACHE = 'menu-v1';
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
      self.addEventListener('fetch', e => {
        const req = e.request;
        if (req.method !== 'GET') return;
        e.respondWith(
          caches.open(CACHE).then(async cache => {
            try {
              const fresh = await fetch(req);
              if (fresh && fresh.status === 200 && fresh.type === 'basic') cache.put(req, fresh.clone());
              return fresh;
            } catch (_) {
              const cached = await cache.match(req);
              if (cached) return cached;
              throw _;
            }
          })
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    await navigator.serviceWorker.register(url, { scope: './' });
    console.log('[SW] registrado');
  } catch (err) {
    console.warn('[SW] no se pudo registrar:', err);
  }
})();
</script>
